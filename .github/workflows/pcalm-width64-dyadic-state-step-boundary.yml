name: PC-ALM seed-860 state precision diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-width64-dyadic-state-step-boundary.yml
      - scripts/diagnose_pcalm_width64_leaky_state_precision.py

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Isolate seed-860 state precision failure at T128
        run: |
          uv run python scripts/diagnose_pcalm_width64_leaky_state_precision.py \
            --seed 860 \
            --budget 128 \
            --state-lr 0.25 \
            --dual-leak 0.02 \
            --out results/generated/pcalm_seed860_T128_state_precision.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-seed860-T128-state-precision
          path: results/generated/pcalm_seed860_T128_state_precision.csv
          if-no-files-found: error
