name: PC-ALM independent failure budget diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-width64-dyadic-state-step-boundary.yml
      - scripts/diagnose_pcalm_width64_dyadic_state_step_budget.py

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [860, 862]
        budget: [104, 108, 128]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Diagnose independent holdout failures
        run: |
          uv run python scripts/diagnose_pcalm_width64_dyadic_state_step_budget.py \
            --seed ${{ matrix.seed }} \
            --budget ${{ matrix.budget }} \
            --out results/generated/pcalm_width64_dyadic_step_T${{ matrix.budget }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-independent-failure-seed-${{ matrix.seed }}-T${{ matrix.budget }}
          path: results/generated/pcalm_width64_dyadic_step_T${{ matrix.budget }}_seed${{ matrix.seed }}.csv
          if-no-files-found: error
