name: PC-ALM T103 independent holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-width64-dyadic-state-step-boundary.yml
      - scripts/diagnose_pcalm_width64_dyadic_state_step_budget.py

jobs:
  holdout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [860, 861, 862, 863, 864, 865, 866, 867, 868, 869, 870, 871, 872, 873, 874]
        budget: [103]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Run independent T103 holdout
        run: |
          uv run python scripts/diagnose_pcalm_width64_dyadic_state_step_budget.py \
            --seed ${{ matrix.seed }} \
            --budget ${{ matrix.budget }} \
            --out results/generated/pcalm_width64_dyadic_step_T${{ matrix.budget }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-T103-independent-seed-${{ matrix.seed }}
          path: results/generated/pcalm_width64_dyadic_step_T${{ matrix.budget }}_seed${{ matrix.seed }}.csv
          if-no-files-found: error
