name: FlyVis strict curvature components

on:
  push:
    paths:
      - "scripts/diagnose_flyvis_strict_curvature_components.py"
      - ".github/workflows/flyvis-strict-curvature-components.yml"
  workflow_dispatch:

jobs:
  decompose:
    strategy:
      fail-fast: false
      matrix:
        rule:
          - local
          - type_pair_edge_permuted
          - source_position_edge_permuted
          - bias_permuted
          - type_pair_mean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Decompose curvature ${{ matrix.rule }}
        run: >-
          uv run python scripts/diagnose_flyvis_strict_curvature_components.py
          --rule ${{ matrix.rule }}
          --seeds 10
          --nudge-steps 16
          --out results/generated/flyvis_strict_curvature_components_${{ matrix.rule }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-strict-curvature-components-${{ matrix.rule }}
          path: results/generated/flyvis_strict_curvature_components_${{ matrix.rule }}.csv
