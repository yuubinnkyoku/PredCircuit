name: Format Python

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/format-python.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync --extra malecns
      - name: Format Python sources
        run: uv run ruff format src tests scripts
      - name: Verify lint and tests
        run: |
          uv run ruff check src tests scripts
          uv run ty check src tests scripts
          uv run pytest
      - name: Commit formatting only
        run: |
          if git diff --quiet -- src tests scripts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "Format Python sources with Ruff"
          git push
