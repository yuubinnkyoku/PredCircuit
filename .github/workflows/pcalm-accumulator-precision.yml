name: PC-ALM accumulator precision holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/pcalm-accumulator-precision.yml]

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [820,821,822,823,824,825,826,827,828,829,830,831,832,833,834,835,836,837,838,839]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/diagnose_pcalm_accumulator_precision.py --seed ${{ matrix.seed }} --out results/generated/pcalm_accumulator_precision_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-accumulator-precision-seed-${{ matrix.seed }}
          path: results/generated/pcalm_accumulator_precision_seed${{ matrix.seed }}.csv
          if-no-files-found: error
  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-accumulator-precision-seed-*
          path: artifacts
          merge-multiple: true
      - run: uv run python scripts/aggregate_pcalm_accumulator_precision.py --input artifacts --out results/generated/pcalm_accumulator_precision_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-accumulator-precision-aggregate
          path: results/generated/pcalm_accumulator_precision_summary.csv
          if-no-files-found: error
