name: FlyVis branched topology geometry

on:
  push:
    paths:
      - .github/workflows/flyvis-branched-topology-geometry.yml
      - scripts/diagnose_flyvis_branched_topology_geometry.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/diagnose_flyvis_topology_credit_geometry.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Compare corrected branched credit across topology nulls
        run: >-
          uv run python scripts/diagnose_flyvis_branched_topology_geometry.py
          --extent 2
          --seeds 20
          --repeats 3
          --frames 7
          --frame-steps 2
          --nudge-steps 2
          --step-size 0.015
          --beta 0.03
          --out results/generated/flyvis_branched_topology_geometry.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branched-topology-geometry
          path: results/generated/flyvis_branched_topology_geometry.csv
