name: FlyVis temporal local PC cycle-batch test

on:
  push:
    paths:
      - .github/workflows/flyvis-temporal-cycle-batch.yml
      - scripts/run_flyvis_temporal_cycle_batch.py
      - scripts/run_flyvis_retinotopic_temporal_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  cycle-batch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        beta: [0.03, 0.1, 0.3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train cycle-batched extent-2 local PC at beta ${{ matrix.beta }}
        run: >-
          uv run python scripts/run_flyvis_temporal_cycle_batch.py
          --extent 2
          --seeds 5
          --epochs 100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta ${{ matrix.beta }}
          --weight-lr 10.0
          --test-repeats 8
          --out results/generated/flyvis_temporal_cycle_batch_beta_${{ matrix.beta }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-temporal-cycle-batch-beta-${{ matrix.beta }}
          path: results/generated/flyvis_temporal_cycle_batch_beta_${{ matrix.beta }}.csv
