name: FlyVis shared parameter horizon

on:
  push:
    paths:
      - ".github/workflows/flyvis-shared-parameter-horizon.yml"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nudge_steps: [4, 8, 16, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Train shared local nudge=${{ matrix.nudge_steps }}
        run: >-
          uv run python scripts/run_flyvis_shared_parameter_training.py
          --mode local
          --seeds 5
          --epochs 100
          --nudge-steps ${{ matrix.nudge_steps }}
          --learning-rate 0.01
          --test-repeats 8
          --out results/generated/flyvis_shared_parameter_horizon_n${{ matrix.nudge_steps }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-shared-parameter-horizon-n${{ matrix.nudge_steps }}
          path: results/generated/flyvis_shared_parameter_horizon_n${{ matrix.nudge_steps }}.csv
