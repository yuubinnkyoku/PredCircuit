name: Ruff import diff

on:
  push:
    paths:
      - ".github/workflows/ruff-import-diff.yml"

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Show Ruff import fixes
        run: uv run ruff check --select I --fix --diff scripts/diagnose_flyvis_candidate_pair_interventions.py scripts/run_flyvis_targeted_type_pair_filter.py scripts/diagnose_flyvis_consensus_state_dynamics.py
