name: FlyVis signed-band matched-rate control

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-signed-band-matched-control-1280-1299"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1280, 1281, 1282, 1283, 1284, 1285, 1286, 1287, 1288, 1289, 1290, 1291, 1292, 1293, 1294, 1295, 1296, 1297, 1298, 1299]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run signed-band matched control for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_signed_band_matched_control.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_signed_band_matched_control_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-signed-band-matched-control-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_signed_band_matched_control_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-signed-band-matched-control-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate signed-band matched control
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if not frame["finite"].all():
              raise RuntimeError("non-finite matched-control holdout detected")
          frame.to_csv("results/generated/flyvis_type_pair_signed_band_matched_control.csv", index=False)

          metrics = [
              "cross_entropy",
              "accuracy",
              "hard_margin",
              "soft_margin",
              "correct_probability",
              "wrong_tail_pressure",
              "ce_on_local_correct",
              "ce_on_local_wrong",
          ]
          signs = {
              "cross_entropy": -1.0,
              "accuracy": 1.0,
              "hard_margin": 1.0,
              "soft_margin": 1.0,
              "correct_probability": 1.0,
              "wrong_tail_pressure": -1.0,
              "ce_on_local_correct": -1.0,
              "ce_on_local_wrong": -1.0,
          }
          seed_means = frame.groupby(
              ["seed", "init_mode", "horizon", "rule"], as_index=False
          )[metrics].mean()
          comparisons = (
              ("signed_vs_rho04", "signed_band", "rho04"),
              ("signed_vs_threshold", "signed_band", "threshold"),
              ("rho04_vs_threshold", "rho04", "threshold"),
              ("signed_vs_standard", "signed_band", "standard"),
              ("signed_vs_local", "signed_band", "local"),
          )
          rows = []
          for init_mode in sorted(seed_means.init_mode.unique()):
              for horizon in sorted(seed_means.horizon.unique()):
                  subset = seed_means[
                      (seed_means.init_mode == init_mode) & (seed_means.horizon == horizon)
                  ]
                  piv = {
                      rule: subset[subset.rule == rule].set_index("seed").sort_index()
                      for rule in ("local", "standard", "threshold", "rho04", "signed_band")
                  }
                  for comparison, treatment, reference in comparisons:
                      for metric in metrics:
                          delta = signs[metric] * (
                              piv[treatment][metric] - piv[reference][metric]
                          ).to_numpy(float)
                          mean = float(delta.mean())
                          std = float(delta.std(ddof=1))
                          ci_low, ci_high = stats.t.interval(
                              0.95,
                              len(delta) - 1,
                              loc=mean,
                              scale=std / np.sqrt(len(delta)),
                          )
                          try:
                              wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
                          except ValueError:
                              wilcoxon_p = float("nan")
                          rows.append(
                              {
                                  "init_mode": init_mode,
                                  "horizon": int(horizon),
                                  "comparison": comparison,
                                  "metric": metric,
                                  "n": len(delta),
                                  "mean_improvement": mean,
                                  "ci_low": float(ci_low),
                                  "ci_high": float(ci_high),
                                  "positive": int((delta > 0).sum()),
                                  "t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                                  "wilcoxon_p": wilcoxon_p,
                                  "cohen_dz": mean / std if std > 0 else float("nan"),
                              }
                          )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_signed_band_matched_control_summary.csv",
              index=False,
          )

          diagnostics = frame.groupby(
              ["seed", "init_mode", "horizon", "rule"], as_index=False
          )[
              [
                  "rho04_suppressed_group_fraction",
                  "rho04_suppressed_edge_fraction",
                  "signed_suppressed_group_fraction",
                  "signed_band_added_group_fraction",
                  "signed_suppressed_edge_fraction",
                  "mean_weight_norm_error",
                  "mean_bias_error",
              ]
          ].mean()
          diagnostics.to_csv(
              "results/generated/flyvis_type_pair_signed_band_matched_control_diagnostics.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-signed-band-matched-control-aggregate
          path: |
            results/generated/flyvis_type_pair_signed_band_matched_control.csv
            results/generated/flyvis_type_pair_signed_band_matched_control_summary.csv
            results/generated/flyvis_type_pair_signed_band_matched_control_diagnostics.csv
