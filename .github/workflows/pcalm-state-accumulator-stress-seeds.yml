name: PC-ALM accumulator stress-seed scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pcalm-state-accumulator-stress-seeds.yml"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        block: [10, 20, 30, 40, 50, 60, 70, 80, 90]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Scan ten seeds in this block
        shell: bash
        run: |
          mkdir -p results/stress
          for seed in $(seq ${{ matrix.block }} $(( ${{ matrix.block }} + 9 ))); do
            python scripts/diagnose_pcalm_state_accumulator_precision.py \
              --seed "$seed" --budget 128 --state-lr 0.25 --dual-leak 0.02 --interval 1 \
              --accumulators fixed15_i3 \
              --out "results/stress/seed${seed}_15i3.csv"
            python scripts/diagnose_pcalm_state_accumulator_precision.py \
              --seed "$seed" --budget 128 --state-lr 0.25 --dual-leak 0.02 --interval 32 \
              --accumulators fixed16_i4 \
              --out "results/stress/seed${seed}_16i4.csv"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-accumulator-stress-block-${{ matrix.block }}
          path: results/stress/*.csv
