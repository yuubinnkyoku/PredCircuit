name: FlyVis branched Adam epsilon

on:
  push:
    paths:
      - .github/workflows/flyvis-branched-adam-epsilon.yml
      - scripts/run_flyvis_branched_classification_adam.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nudge_steps: [2, 4, 8, 16, 32]
        include: []
        adam_epsilon: [1e-9, 1e-7]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train at nudge ${{ matrix.nudge_steps }} and epsilon ${{ matrix.adam_epsilon }}
        run: >-
          uv run python scripts/run_flyvis_branched_classification_adam.py
          --extent 2
          --seeds 10
          --epochs 100
          --frames 7
          --frame-steps 2
          --nudge-steps ${{ matrix.nudge_steps }}
          --step-size 0.015
          --beta 0.03
          --learning-rate 0.01
          --beta1 0.9
          --beta2 0.999
          --adam-epsilon ${{ matrix.adam_epsilon }}
          --test-repeats 8
          --out results/generated/flyvis_branched_adam_nudge_${{ matrix.nudge_steps }}_epsilon_${{ matrix.adam_epsilon }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branched-adam-nudge-${{ matrix.nudge_steps }}-epsilon-${{ matrix.adam_epsilon }}
          path: results/generated/flyvis_branched_adam_nudge_${{ matrix.nudge_steps }}_epsilon_${{ matrix.adam_epsilon }}.csv
