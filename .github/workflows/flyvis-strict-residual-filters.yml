name: FlyVis strict residual filters

on:
  push:
    paths:
      - .github/workflows/flyvis-strict-residual-filters.yml
      - scripts/run_flyvis_strict_residual_filters.py
      - scripts/run_flyvis_strict_residual_controls.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rule:
          - local
          - type_pair_mean
          - offset_mean
          - source_position_mean
          - target_position_mean
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train strict residual filter ${{ matrix.rule }}
        run: >-
          uv run python scripts/run_flyvis_strict_residual_filters.py
          --rule ${{ matrix.rule }}
          --seeds 5
          --epochs 100
          --nudge-steps 16
          --learning-rate 0.01
          --test-repeats 8
          --out results/generated/flyvis_strict_residual_filter_${{ matrix.rule }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-strict-residual-filter-${{ matrix.rule }}
          path: results/generated/flyvis_strict_residual_filter_${{ matrix.rule }}.csv
