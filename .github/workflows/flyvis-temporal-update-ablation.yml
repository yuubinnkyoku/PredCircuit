name: FlyVis temporal update ablation

on:
  push:
    paths:
      - .github/workflows/flyvis-temporal-update-ablation.yml
      - scripts/run_flyvis_temporal_update_ablation.py
      - scripts/run_flyvis_retinotopic_temporal_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  ablate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Ablate edge and bias plasticity
        run: >-
          uv run python scripts/run_flyvis_temporal_update_ablation.py
          --extent 1
          --seeds 10
          --epochs 100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta 0.3
          --learning-rate 10.0
          --test-repeats 8
          --out results/generated/flyvis_temporal_update_ablation.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-temporal-update-ablation
          path: results/generated/flyvis_temporal_update_ablation.csv
