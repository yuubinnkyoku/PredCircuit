name: PC-ALM width-64 accumulator holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-accumulator-width64-holdout.yml
      - scripts/diagnose_pcalm_accumulator_width.py
      - scripts/aggregate_pcalm_accumulator_width.py
      - scripts/diagnose_pcalm_accumulator_precision.py
      - scripts/diagnose_pcalm_mac_operand_precision.py
      - scripts/diagnose_pcalm_update_precision.py
      - scripts/diagnose_pcalm_dual_precision.py
      - src/predcircuit/pcalm.py

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run python scripts/diagnose_pcalm_accumulator_width.py
          --width 64
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_accumulator_width_w64_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-accumulator-width64-holdout-seed-${{ matrix.seed }}
          path: results/generated/pcalm_accumulator_width_w64_seed${{ matrix.seed }}.csv
          if-no-files-found: error

  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-accumulator-width64-holdout-*
          path: artifacts
          merge-multiple: true
      - run: >-
          uv run python scripts/aggregate_pcalm_accumulator_width.py
          --input artifacts
          --out results/generated/pcalm_accumulator_width64_holdout_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-accumulator-width64-holdout-aggregate
          path: results/generated/pcalm_accumulator_width64_holdout_summary.csv
          if-no-files-found: error
