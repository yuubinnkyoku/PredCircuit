name: FlyVis type-pair selective fork timing holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-selective-fork-timing-2190-2209"
  workflow_dispatch:

jobs:
  holdout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [2190, 2191, 2192, 2193, 2194, 2195, 2196, 2197, 2198, 2199, 2200, 2201, 2202, 2203, 2204, 2205, 2206, 2207, 2208, 2209]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run fork timing holdout for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_selective_fork_timing_holdout.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_selective_fork_timing_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-selective-fork-timing-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_selective_fork_timing_seed${{ matrix.seed }}.csv

  aggregate:
    needs: holdout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-selective-fork-timing-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate fork timing holdout
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 960:
              raise RuntimeError(f"expected 960 rows, got {len(frame)}")
          if frame["seed"].nunique() != 20:
              raise RuntimeError("expected 20 unique seeds")
          if not frame["finite"].all():
              raise RuntimeError("non-finite fork timing result detected")
          global_rows = frame[frame["rule"] == "global035"]
          if global_rows["matched_l2_relative_error"].max() > 2e-5:
              raise RuntimeError("global L2 match relative error exceeded 2e-5")
          frame.to_csv(
              "results/generated/flyvis_type_pair_selective_fork_timing_holdout.csv",
              index=False,
          )

          metrics = ["cross_entropy", "accuracy", "hard_margin", "soft_margin", "weight_norm"]
          seed_mean = (
              frame.groupby(["seed", "init_scale", "fork_epoch", "rule"], as_index=False)[metrics]
              .mean()
          )
          comparisons = [
              ("soft035", "global035"),
              ("soft035", "standard"),
              ("global035", "standard"),
          ]
          rows = []
          for (scale, fork_epoch), subset in seed_mean.groupby(["init_scale", "fork_epoch"]):
              pivot = subset.pivot(index="seed", columns="rule", values=metrics)
              for left, right in comparisons:
                  for metric in metrics:
                      values = (pivot[metric][left] - pivot[metric][right]).to_numpy(float)
                      if len(values) != 20:
                          raise RuntimeError("paired comparison lost a seed")
                      mean = float(values.mean())
                      std = float(values.std(ddof=1))
                      if std > 0.0:
                          ci_low, ci_high = stats.t.interval(
                              0.95,
                              len(values) - 1,
                              loc=mean,
                              scale=std / np.sqrt(len(values)),
                          )
                          p = float(stats.ttest_1samp(values, 0.0).pvalue)
                          try:
                              w_p = float(stats.wilcoxon(values).pvalue)
                          except ValueError:
                              w_p = float("nan")
                          dz = mean / std
                      else:
                          ci_low = ci_high = mean
                          p = 1.0 if mean == 0.0 else 0.0
                          w_p = p
                          dz = float("nan")
                      rows.append(
                          {
                              "init_scale": float(scale),
                              "fork_epoch": int(fork_epoch),
                              "comparison": f"{left}-{right}",
                              "metric": metric,
                              "n": len(values),
                              "mean": mean,
                              "ci_low": float(ci_low),
                              "ci_high": float(ci_high),
                              "positive": int((values > 0.0).sum()),
                              "negative": int((values < 0.0).sum()),
                              "t_p": p,
                              "wilcoxon_p": w_p,
                              "cohen_dz": dz,
                          }
                      )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_selective_fork_timing_summary.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-selective-fork-timing-aggregate
          path: |
            results/generated/flyvis_type_pair_selective_fork_timing_holdout.csv
            results/generated/flyvis_type_pair_selective_fork_timing_summary.csv
