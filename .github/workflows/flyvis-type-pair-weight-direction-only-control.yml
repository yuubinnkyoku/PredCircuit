name: FlyVis type-pair weight-direction-only control

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_flyvis_type_pair_weight_direction_only_control.py"
      - ".github/workflows/flyvis-type-pair-weight-direction-only-control.yml"

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [140, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 156, 157, 158, 159]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync
      - name: Train paired weight-direction-only control
        run: >-
          uv run python scripts/run_flyvis_type_pair_weight_direction_only_control.py
          --seed ${{ matrix.seed }}
          --learning-rate 160
          --out results/generated/weight_direction_only_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: weight-direction-only-seed${{ matrix.seed }}
          path: results/generated/weight_direction_only_seed${{ matrix.seed }}.csv

  aggregate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: weight-direction-only-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate paired weight-direction-only control
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import math
          import pandas as pd
          import scipy.stats as stats

          frame = pd.concat(
              [pd.read_csv(path) for path in sorted(Path("artifacts").glob("*.csv"))],
              ignore_index=True,
          )
          if len(frame) != 40:
              raise RuntimeError(f"expected 40 rows, got {len(frame)}")
          if not bool(frame["finite"].all()):
              raise RuntimeError("non-finite weight-direction-only result")

          local = frame[frame.rule == "local"].set_index("seed").sort_index()
          shared = frame[frame.rule == "shared_weight_direction_only"].set_index("seed").sort_index()
          if not local.index.equals(shared.index):
              raise RuntimeError("paired seed mismatch")

          rows = []
          for metric, higher_is_better in (
              ("cross_entropy_after", False),
              ("accuracy_after", True),
              ("margin_after", True),
          ):
              raw = shared[metric] - local[metric]
              delta = raw if higher_is_better else -raw
              n = len(delta)
              mean = float(delta.mean())
              sd = float(delta.std(ddof=1))
              se = sd / math.sqrt(n)
              tcrit = float(stats.t.ppf(0.975, n - 1))
              try:
                  wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
              except ValueError:
                  wilcoxon_p = float("nan")
              rows.append({
                  "metric": metric,
                  "n": n,
                  "mean_gain_vs_local": mean,
                  "median_gain_vs_local": float(delta.median()),
                  "ci95_low": mean - tcrit * se,
                  "ci95_high": mean + tcrit * se,
                  "improved_seeds": int((delta > 0).sum()),
                  "paired_t_p": float(stats.ttest_rel(shared[metric], local[metric]).pvalue),
                  "wilcoxon_p": wilcoxon_p,
                  "cohen_dz": mean / sd if sd > 0 else float("nan"),
              })

          final_weight_error = float((shared.weight_norm - local.weight_norm).abs().max())
          final_bias_error = float((shared.bias_norm - local.bias_norm).abs().max())
          if final_weight_error > 2e-5:
              raise RuntimeError(f"weight norm mismatch too large: {final_weight_error}")
          if final_bias_error > 2e-6:
              raise RuntimeError(f"bias norm mismatch too large: {final_bias_error}")

          summary = pd.DataFrame(rows)
          frame.to_csv("results/generated/flyvis_type_pair_weight_direction_only_control.csv", index=False)
          summary.to_csv(
              "results/generated/flyvis_type_pair_weight_direction_only_control_summary.csv",
              index=False,
          )
          print(summary.to_string(index=False))
          print("\nRule means:")
          print(frame.groupby("rule")[[
              "weight_norm",
              "bias_norm",
              "mean_relative_direction_change",
              "mean_pre_weight_norm_ratio",
              "mean_post_weight_norm_error",
              "mean_post_bias_vector_error",
              "mean_edge_clip_fraction",
          ]].mean().to_string())
          print("\nMax final paired weight norm error:", final_weight_error)
          print("Max final paired bias norm error:", final_bias_error)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-weight-direction-only-control-aggregate
          path: |
            results/generated/flyvis_type_pair_weight_direction_only_control.csv
            results/generated/flyvis_type_pair_weight_direction_only_control_summary.csv
