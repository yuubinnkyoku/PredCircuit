name: FlyVis signed-band branched trajectory

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-signed-band-branched-trajectory-1340-1359"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1340, 1341, 1342, 1343, 1344, 1345, 1346, 1347, 1348, 1349, 1350, 1351, 1352, 1353, 1354, 1355, 1356, 1357, 1358, 1359]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run branched trajectory for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_signed_band_branched_trajectory.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_signed_band_branched_trajectory_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-signed-band-branched-trajectory-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_signed_band_branched_trajectory_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-signed-band-branched-trajectory-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate branched trajectory
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if not frame["finite"].all():
              raise RuntimeError("non-finite branched trajectory detected")
          frame.to_csv(
              "results/generated/flyvis_type_pair_signed_band_branched_trajectory.csv",
              index=False,
          )

          metrics = (
              "signed_minus_rho04_cross_entropy",
              "signed_minus_rho04_accuracy",
              "signed_minus_rho04_hard_margin",
              "signed_minus_rho04_soft_margin",
              "branch_weight_distance",
              "branch_bias_distance",
              "rho04_state_mean_rho",
              "signed_state_mean_rho",
              "rho04_state_rho_ge_05_fraction",
              "signed_state_rho_ge_05_fraction",
              "rho04_state_signed_only_group_fraction",
              "signed_state_signed_only_group_fraction",
              "rho04_state_rho04_only_group_fraction",
              "signed_state_rho04_only_group_fraction",
          )
          per_seed = frame.groupby(
              ["seed", "init_mode", "branch_step"], as_index=False
          )[list(metrics)].mean()
          rows = []
          for init_mode in sorted(per_seed["init_mode"].unique()):
              for branch_step in sorted(per_seed["branch_step"].unique()):
                  subset = per_seed[
                      (per_seed.init_mode == init_mode)
                      & (per_seed.branch_step == branch_step)
                  ]
                  for metric in metrics:
                      values = subset[metric].to_numpy(float)
                      mean = float(values.mean())
                      std = float(values.std(ddof=1))
                      if std > 0.0:
                          ci_low, ci_high = stats.t.interval(
                              0.95,
                              len(values) - 1,
                              loc=mean,
                              scale=std / np.sqrt(len(values)),
                          )
                          t_p = float(stats.ttest_1samp(values, 0.0).pvalue)
                          dz = mean / std
                      else:
                          ci_low = mean
                          ci_high = mean
                          t_p = 1.0 if mean == 0.0 else 0.0
                          dz = float("nan")
                      rows.append(
                          {
                              "init_mode": init_mode,
                              "branch_step": int(branch_step),
                              "metric": metric,
                              "n": len(values),
                              "mean": mean,
                              "ci_low": float(ci_low),
                              "ci_high": float(ci_high),
                              "positive": int((values > 0).sum()),
                              "t_p": t_p,
                              "wilcoxon_p": float(stats.wilcoxon(values).pvalue)
                              if np.any(values != 0.0)
                              else 1.0,
                              "cohen_dz": dz,
                          }
                      )
          summary = pd.DataFrame(rows)
          summary.to_csv(
              "results/generated/flyvis_type_pair_signed_band_branched_trajectory_summary.csv",
              index=False,
          )

          hard = per_seed.pivot(
              index=["seed", "init_mode"],
              columns="branch_step",
              values="signed_minus_rho04_hard_margin",
          ).reset_index()
          amplification_rows = []
          for init_mode in sorted(hard["init_mode"].unique()):
              subset = hard[hard.init_mode == init_mode]
              for late_step in (2, 5, 10, 20):
                  values = (subset[late_step] - subset[1]).to_numpy(float)
                  mean = float(values.mean())
                  std = float(values.std(ddof=1))
                  ci_low, ci_high = stats.t.interval(
                      0.95,
                      len(values) - 1,
                      loc=mean,
                      scale=std / np.sqrt(len(values)),
                  )
                  amplification_rows.append(
                      {
                          "init_mode": init_mode,
                          "late_step": late_step,
                          "n": len(values),
                          "hard_margin_delta_minus_step1": mean,
                          "ci_low": float(ci_low),
                          "ci_high": float(ci_high),
                          "positive": int((values > 0).sum()),
                          "t_p": float(stats.ttest_1samp(values, 0.0).pvalue),
                          "cohen_dz": mean / std if std > 0.0 else float("nan"),
                      }
                  )
          pd.DataFrame(amplification_rows).to_csv(
              "results/generated/flyvis_type_pair_signed_band_branched_trajectory_amplification.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-signed-band-branched-trajectory-aggregate
          path: |
            results/generated/flyvis_type_pair_signed_band_branched_trajectory.csv
            results/generated/flyvis_type_pair_signed_band_branched_trajectory_summary.csv
            results/generated/flyvis_type_pair_signed_band_branched_trajectory_amplification.csv
