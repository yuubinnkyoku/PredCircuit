name: FlyVis type-pair selective gradient geometry aggregate repair

on:
  push:
    paths:
      - ".github/triggers/repair-type-pair-selective-gradient-geometry-aggregate-34785741683"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34785741683
          pattern: type-pair-selective-gradient-geometry-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate existing selective gradient geometry artifacts
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 120:
              raise RuntimeError(f"expected 120 rows, got {len(frame)}")
          if frame["seed"].nunique() != 20:
              raise RuntimeError("expected 20 unique seeds")
          if not frame["finite"].all():
              raise RuntimeError("non-finite selective gradient geometry result detected")

          frame["l2_match_absolute_error"] = (
              frame["soft_update_l2"] - frame["global_update_l2"]
          ).abs()
          max_relative = float(frame["l2_match_relative_error"].max())
          max_absolute = float(frame["l2_match_absolute_error"].max())
          if max_relative > 2e-5 or max_absolute > 1e-4:
              raise RuntimeError(
                  "global L2 match error exceeded float32 repair tolerance: "
                  f"relative={max_relative}, absolute={max_absolute}"
              )
          frame.to_csv(
              "results/generated/flyvis_type_pair_selective_gradient_geometry.csv",
              index=False,
          )

          metrics = [
              "candidate_edge_fraction",
              "candidate_group_fraction",
              "redistribution_l2",
              "ce_grad_dot_redistribution",
              "hard_grad_dot_redistribution",
              "soft_grad_dot_redistribution",
              "ce_grad_dot_soft_removed",
              "hard_grad_dot_soft_removed",
              "soft_grad_dot_soft_removed",
              "ce_grad_dot_global_removed",
              "hard_grad_dot_global_removed",
              "soft_grad_dot_global_removed",
              "candidate_ce_grad_cos_standard",
              "candidate_hard_grad_cos_standard",
              "candidate_soft_grad_cos_standard",
              "noncandidate_ce_grad_cos_standard",
              "noncandidate_hard_grad_cos_standard",
              "noncandidate_soft_grad_cos_standard",
              "soft_minus_global_next_ce",
              "soft_minus_global_next_hard",
              "soft_minus_global_next_soft",
          ]
          rows = []
          for (scale, horizon), subset in frame.groupby(["init_scale", "horizon"]):
              for metric in metrics:
                  values = subset[metric].to_numpy(float)
                  mean = float(values.mean())
                  std = float(values.std(ddof=1))
                  if std > 0.0:
                      ci_low, ci_high = stats.t.interval(
                          0.95,
                          len(values) - 1,
                          loc=mean,
                          scale=std / np.sqrt(len(values)),
                      )
                      p = float(stats.ttest_1samp(values, 0.0).pvalue)
                      try:
                          w_p = float(stats.wilcoxon(values).pvalue)
                      except ValueError:
                          w_p = float("nan")
                      dz = mean / std
                  else:
                      ci_low = ci_high = mean
                      p = 1.0 if mean == 0.0 else 0.0
                      w_p = p
                      dz = float("nan")
                  rows.append(
                      {
                          "init_scale": float(scale),
                          "horizon": int(horizon),
                          "metric": metric,
                          "n": len(values),
                          "mean": mean,
                          "ci_low": float(ci_low),
                          "ci_high": float(ci_high),
                          "positive": int((values > 0.0).sum()),
                          "negative": int((values < 0.0).sum()),
                          "t_p": p,
                          "wilcoxon_p": w_p,
                          "cohen_dz": dz,
                      }
                  )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_selective_gradient_geometry_summary.csv",
              index=False,
          )
          pd.DataFrame(
              [
                  {
                      "source_run": 34785741683,
                      "max_l2_relative_error": max_relative,
                      "max_l2_absolute_error": max_absolute,
                      "finite_rows": int(frame["finite"].sum()),
                      "total_rows": len(frame),
                  }
              ]
          ).to_csv(
              "results/generated/flyvis_type_pair_selective_gradient_geometry_repair_diagnostics.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-selective-gradient-geometry-aggregate-repair
          path: |
            results/generated/flyvis_type_pair_selective_gradient_geometry.csv
            results/generated/flyvis_type_pair_selective_gradient_geometry_summary.csv
            results/generated/flyvis_type_pair_selective_gradient_geometry_repair_diagnostics.csv
