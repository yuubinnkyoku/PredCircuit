name: FlyVis type-pair selective phase-factorial holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-selective-phase-factorial-2250-2269"
  workflow_dispatch:

jobs:
  holdout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [2250, 2251, 2252, 2253, 2254, 2255, 2256, 2257, 2258, 2259, 2260, 2261, 2262, 2263, 2264, 2265, 2266, 2267, 2268, 2269]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run phase-factorial holdout for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_selective_phase_factorial_holdout.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_selective_phase_factorial_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-selective-phase-factorial-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_selective_phase_factorial_seed${{ matrix.seed }}.csv

  aggregate:
    needs: holdout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-selective-phase-factorial-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate phase-factorial holdout
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 400:
              raise RuntimeError(f"expected 400 rows, got {len(frame)}")
          if frame["seed"].nunique() != 20:
              raise RuntimeError("expected 20 unique seeds")
          if not frame["finite"].all():
              raise RuntimeError("non-finite phase-factorial result detected")

          checks = [
              ("global_global", "early_matched_l2_relative_error"),
              ("global_global", "late_matched_l2_relative_error"),
              ("soft_global", "late_matched_l2_relative_error"),
              ("global_soft", "early_matched_l2_relative_error"),
          ]
          for policy, column in checks:
              maximum = frame.loc[frame["policy"] == policy, column].max()
              if maximum > 2e-5:
                  raise RuntimeError(f"{policy} {column} exceeded 2e-5: {maximum}")

          frame.to_csv(
              "results/generated/flyvis_type_pair_selective_phase_factorial_holdout.csv",
              index=False,
          )

          metrics = ["cross_entropy", "accuracy", "hard_margin", "soft_margin", "weight_norm"]
          seed_mean = frame.groupby(["seed", "policy"], as_index=False)[metrics].mean()
          comparisons = [
              ("soft_soft", "global_global"),
              ("soft_soft", "soft_global"),
              ("soft_soft", "global_soft"),
              ("soft_global", "global_global"),
              ("global_soft", "global_global"),
              ("soft_soft", "standard"),
              ("global_global", "standard"),
          ]

          def summarize(values: np.ndarray) -> dict[str, float | int]:
              mean = float(values.mean())
              std = float(values.std(ddof=1))
              if std > 0.0:
                  ci_low, ci_high = stats.t.interval(
                      0.95,
                      len(values) - 1,
                      loc=mean,
                      scale=std / np.sqrt(len(values)),
                  )
                  p = float(stats.ttest_1samp(values, 0.0).pvalue)
                  try:
                      w_p = float(stats.wilcoxon(values).pvalue)
                  except ValueError:
                      w_p = float("nan")
                  dz = mean / std
              else:
                  ci_low = ci_high = mean
                  p = 1.0 if mean == 0.0 else 0.0
                  w_p = p
                  dz = float("nan")
              return {
                  "n": len(values),
                  "mean": mean,
                  "ci_low": float(ci_low),
                  "ci_high": float(ci_high),
                  "positive": int((values > 0.0).sum()),
                  "negative": int((values < 0.0).sum()),
                  "t_p": p,
                  "wilcoxon_p": w_p,
                  "cohen_dz": dz,
              }

          pivot = seed_mean.pivot(index="seed", columns="policy", values=metrics)
          rows = []
          for left, right in comparisons:
              for metric in metrics:
                  values = (pivot[metric][left] - pivot[metric][right]).to_numpy(float)
                  rows.append(
                      {
                          "contrast": f"{left}-{right}",
                          "metric": metric,
                          **summarize(values),
                      }
                  )

          for metric in metrics:
              interaction = (
                  pivot[metric]["soft_soft"]
                  - pivot[metric]["soft_global"]
                  - pivot[metric]["global_soft"]
                  + pivot[metric]["global_global"]
              ).to_numpy(float)
              rows.append(
                  {
                      "contrast": "early_x_late_selectivity_interaction",
                      "metric": metric,
                      **summarize(interaction),
                  }
              )

          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_selective_phase_factorial_summary.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-selective-phase-factorial-aggregate
          path: |
            results/generated/flyvis_type_pair_selective_phase_factorial_holdout.csv
            results/generated/flyvis_type_pair_selective_phase_factorial_summary.csv
