name: FlyVis grouping identity control

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_flyvis_grouping_identity_control.py"
      - ".github/workflows/flyvis-grouping-identity-control.yml"

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [85, 86, 87, 88, 89, 90, 91, 92, 93, 94]
        grouping: [local, type_pair, random_a, random_b, source_type, target_type, global]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train grouping control
        run: >-
          uv run python scripts/run_flyvis_grouping_identity_control.py
          --seed ${{ matrix.seed }}
          --grouping ${{ matrix.grouping }}
          --epochs 100
          --learning-rate 160
          --out results/generated/group_${{ matrix.grouping }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: group-${{ matrix.grouping }}-seed${{ matrix.seed }}
          path: results/generated/group_${{ matrix.grouping }}_seed${{ matrix.seed }}.csv

  aggregate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: group-*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate grouping control
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import math
          import pandas as pd
          import scipy.stats as stats

          frame = pd.concat(
              [pd.read_csv(path) for path in sorted(Path("artifacts").glob("*.csv"))],
              ignore_index=True,
          )
          if len(frame) != 70:
              raise RuntimeError(f"expected 70 rows, got {len(frame)}")
          if not bool(frame["finite"].all()):
              raise RuntimeError("non-finite result")
          frame.to_csv("results/generated/flyvis_grouping_identity_control.csv", index=False)
          by = {g: frame[frame.grouping == g].set_index("seed").sort_index() for g in frame.grouping.unique()}
          rows = []
          for lhs, rhs in [
              ("type_pair", "local"),
              ("random_a", "local"),
              ("random_b", "local"),
              ("source_type", "local"),
              ("target_type", "local"),
              ("global", "local"),
              ("type_pair", "random_a"),
              ("type_pair", "random_b"),
              ("type_pair", "source_type"),
              ("type_pair", "target_type"),
              ("type_pair", "global"),
          ]:
              a = by[lhs]
              b = by[rhs].loc[a.index]
              delta = b.cross_entropy_after - a.cross_entropy_after
              n = len(delta)
              mean = float(delta.mean())
              sd = float(delta.std(ddof=1))
              se = sd / math.sqrt(n)
              tcrit = float(stats.t.ppf(0.975, n - 1))
              try:
                  wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
              except ValueError:
                  wilcoxon_p = float("nan")
              rows.append({
                  "lhs": lhs,
                  "rhs": rhs,
                  "n": n,
                  "mean_ce_gain_lhs_vs_rhs": mean,
                  "ci95_low": mean - tcrit * se,
                  "ci95_high": mean + tcrit * se,
                  "improved_seeds": int((delta > 0).sum()),
                  "paired_t_p": float(stats.ttest_rel(b.cross_entropy_after, a.cross_entropy_after).pvalue),
                  "wilcoxon_p": wilcoxon_p,
                  "cohen_dz": mean / sd if sd > 0 else float("nan"),
                  "lhs_ce_mean": float(a.cross_entropy_after.mean()),
                  "rhs_ce_mean": float(b.cross_entropy_after.mean()),
                  "lhs_accuracy_mean": float(a.accuracy_after.mean()),
                  "rhs_accuracy_mean": float(b.accuracy_after.mean()),
                  "lhs_margin_mean": float(a.margin_after.mean()),
                  "rhs_margin_mean": float(b.margin_after.mean()),
                  "lhs_norm_vs_bio_target": float(a.mean_edge_norm_ratio_vs_bio_target.mean()),
                  "rhs_norm_vs_bio_target": float(b.mean_edge_norm_ratio_vs_bio_target.mean()),
              })
          summary = pd.DataFrame(rows)
          summary.to_csv("results/generated/flyvis_grouping_identity_control_summary.csv", index=False)
          print(summary.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-grouping-identity-control-aggregate
          path: |
            results/generated/flyvis_grouping_identity_control.csv
            results/generated/flyvis_grouping_identity_control_summary.csv
