name: PC-ALM state rounding diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-state-rounding.yml
      - scripts/diagnose_pcalm_state_rounding.py

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Compare nearest, stochastic, and error-feedback state rounding
        run: |
          uv run python scripts/diagnose_pcalm_state_rounding.py \
            --seed 860 --budget 128 --state-lr 0.25 --dual-leak 0.02 \
            --stochastic-repeats 8 \
            --out results/generated/pcalm_seed860_state_rounding.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-seed860-state-rounding
          path: results/generated/pcalm_seed860_state_rounding.csv
          if-no-files-found: error
