name: FlyVis branched training trace

on:
  push:
    paths:
      - .github/workflows/flyvis-branched-training-trace.yml
      - scripts/trace_flyvis_branched_training.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_temporal_classification_nudge.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - scripts/run_flyvis_temporal_coherence_gate.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        learning_rate: [80, 160, 320]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Trace learning and credit alignment
        run: >-
          uv run python scripts/trace_flyvis_branched_training.py
          --extent 2
          --seeds 3
          --checkpoints 0,10,25,50,100,200
          --frames 7
          --frame-steps 2
          --nudge-steps 2
          --step-size 0.015
          --beta 0.03
          --learning-rate ${{ matrix.learning_rate }}
          --weight-decay 1e-5
          --max-update 0.05
          --test-repeats 8
          --out results/generated/flyvis_branched_training_trace_lr_${{ matrix.learning_rate }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branched-training-trace-lr-${{ matrix.learning_rate }}
          path: results/generated/flyvis_branched_training_trace_lr_${{ matrix.learning_rate }}.csv
