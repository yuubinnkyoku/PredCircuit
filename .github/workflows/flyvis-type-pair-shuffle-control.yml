name: FlyVis type-pair shuffle control

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_flyvis_type_pair_shuffle_control.py"
      - ".github/workflows/flyvis-type-pair-shuffle-control.yml"

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [60, 61, 62, 63, 64, 65, 66, 67, 68, 69]
        grouping: [type_pair, shuffled]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync
      - name: Train grouping control
        run: |
          SHUFFLE_SEED=$((10000 + ${{ matrix.seed }}))
          uv run python scripts/run_flyvis_type_pair_shuffle_control.py \
            --seed ${{ matrix.seed }} \
            --grouping ${{ matrix.grouping }} \
            --shuffle-seed "$SHUFFLE_SEED" \
            --epochs 100 \
            --learning-rate 160 \
            --out results/generated/shuffle_control_${{ matrix.grouping }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: shuffle-control-${{ matrix.grouping }}-seed${{ matrix.seed }}
          path: results/generated/shuffle_control_${{ matrix.grouping }}_seed${{ matrix.seed }}.csv

  aggregate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shuffle-control-*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate grouping control
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import math
          import pandas as pd
          import scipy.stats as stats

          frame = pd.concat(
              [pd.read_csv(path) for path in sorted(Path("artifacts").glob("*.csv"))],
              ignore_index=True,
          )
          if len(frame) != 20:
              raise RuntimeError(f"expected 20 rows, got {len(frame)}")
          if not bool(frame["finite"].all()):
              raise RuntimeError("non-finite shuffle-control result")
          biological = frame[frame.grouping == "type_pair"].set_index("seed").sort_index()
          shuffled = frame[frame.grouping == "shuffled"].set_index("seed").sort_index()
          if not biological.index.equals(shuffled.index):
              raise RuntimeError("paired seed mismatch")

          rows = []
          for metric, higher_is_better in (
              ("cross_entropy_after", False),
              ("accuracy_after", True),
              ("margin_after", True),
          ):
              delta = biological[metric] - shuffled[metric]
              if not higher_is_better:
                  delta = -delta
              n = len(delta)
              mean = float(delta.mean())
              sd = float(delta.std(ddof=1))
              se = sd / math.sqrt(n)
              tcrit = float(stats.t.ppf(0.975, n - 1))
              ttest = stats.ttest_rel(biological[metric], shuffled[metric])
              try:
                  wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
              except ValueError:
                  wilcoxon_p = float("nan")
              rows.append({
                  "metric": metric,
                  "n": n,
                  "mean_gain_type_pair_vs_shuffled": mean,
                  "median_gain_type_pair_vs_shuffled": float(delta.median()),
                  "sd_gain": sd,
                  "ci95_low": mean - tcrit * se,
                  "ci95_high": mean + tcrit * se,
                  "type_pair_better_seeds": int((delta > 0).sum()),
                  "paired_t_p_two_sided": float(ttest.pvalue),
                  "wilcoxon_p_two_sided": wilcoxon_p,
                  "cohen_dz": mean / sd if sd > 0 else float("nan"),
              })
          summary = pd.DataFrame(rows)
          geometry = (
              frame.groupby("grouping")[[
                  "mean_relative_edge_direction_change",
                  "mean_edge_norm_ratio",
                  "mean_edge_clip_fraction",
                  "weight_norm",
                  "bias_norm",
              ]]
              .mean()
              .reset_index()
          )
          frame.to_csv("results/generated/flyvis_type_pair_shuffle_control.csv", index=False)
          summary.to_csv("results/generated/flyvis_type_pair_shuffle_control_summary.csv", index=False)
          geometry.to_csv("results/generated/flyvis_type_pair_shuffle_control_geometry.csv", index=False)
          print(summary.to_string(index=False))
          print("\nGeometry:")
          print(geometry.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-shuffle-control-aggregate
          path: |
            results/generated/flyvis_type_pair_shuffle_control.csv
            results/generated/flyvis_type_pair_shuffle_control_summary.csv
            results/generated/flyvis_type_pair_shuffle_control_geometry.csv
