name: PC-ALM stochastic rounding seed sensitivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-width64-stochastic-rounding-seed-sensitivity.yml

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [845, 848, 849, 851, 852, 856, 858]
        rep: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Run independent stochastic-rounding trajectory
        shell: bash
        run: |
          rounding_seed=$((1000000 + ${{ matrix.seed }} * 100 + ${{ matrix.rep }}))
          uv run python scripts/diagnose_pcalm_width64_stochastic_update_rounding.py \
            --seed ${{ matrix.seed }} \
            --rounding-seed "$rounding_seed" \
            --stochastic-only \
            --out results/generated/pcalm_width64_stochastic_rounding_sensitivity_seed${{ matrix.seed }}_rep${{ matrix.rep }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-stochastic-rounding-sensitivity-seed-${{ matrix.seed }}-rep-${{ matrix.rep }}
          path: results/generated/pcalm_width64_stochastic_rounding_sensitivity_seed${{ matrix.seed }}_rep${{ matrix.rep }}.csv
          if-no-files-found: error
