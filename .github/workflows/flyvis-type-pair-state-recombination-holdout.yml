name: FlyVis type-pair state recombination holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-state-recombination-840-859"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [840, 841, 842, 843, 844, 845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Diagnose state recombination for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_state_recombination.py \
            --seed ${{ matrix.seed }} \
            --shuffle-seed $((997000 + ${{ matrix.seed }})) \
            --out results/generated/flyvis_type_pair_state_recombination_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-state-recombination-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_state_recombination_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-state-recombination-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate state recombination
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          if len(frame) != 2400:
              raise RuntimeError(f"expected 2400 rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite state recombination run detected")
          frame.to_csv("results/generated/flyvis_type_pair_state_recombination.csv", index=False)

          metric_cols = ["cross_entropy", "accuracy", "hard_margin"]
          seed_means = frame.groupby(["seed", "horizon", "rule"], as_index=False)[metric_cols].mean()

          rows = []
          for horizon in sorted(seed_means["horizon"].unique()):
              subset = seed_means[seed_means.horizon == horizon]
              wide = {
                  rule: subset[subset.rule == rule].set_index("seed").sort_index()
                  for rule in subset.rule.unique()
              }
              local = wide["local"]
              type_ = wide["type"].loc[local.index]

              for prefix in ("bio", "shuffle"):
                  proj = wide[f"{prefix}_type_projection_local_residual"].loc[local.index]
                  resid = wide[f"{prefix}_local_projection_type_residual"].loc[local.index]
                  for metric in metric_cols:
                      if metric == "cross_entropy":
                          local_perf = -local[metric]
                          type_perf = -type_[metric]
                          proj_perf = -proj[metric]
                          resid_perf = -resid[metric]
                      else:
                          local_perf = local[metric]
                          type_perf = type_[metric]
                          proj_perf = proj[metric]
                          resid_perf = resid[metric]

                      projection_main = proj_perf - local_perf
                      residual_main = resid_perf - local_perf
                      interaction = type_perf - proj_perf - resid_perf + local_perf
                      total = type_perf - local_perf

                      for effect_name, values in (
                          ("projection_main", projection_main),
                          ("residual_main", residual_main),
                          ("interaction", interaction),
                          ("type_total", total),
                      ):
                          delta = values.to_numpy(float)
                          mean = float(delta.mean())
                          std = float(delta.std(ddof=1))
                          ci_low, ci_high = stats.t.interval(
                              0.95,
                              len(delta) - 1,
                              loc=mean,
                              scale=std / np.sqrt(len(delta)),
                          )
                          try:
                              wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
                          except ValueError:
                              wilcoxon_p = float("nan")
                          rows.append(
                              {
                                  "horizon": int(horizon),
                                  "basis": prefix,
                                  "metric": metric,
                                  "effect": effect_name,
                                  "n": len(delta),
                                  "mean": mean,
                                  "ci_low": float(ci_low),
                                  "ci_high": float(ci_high),
                                  "positive": int((delta > 0).sum()),
                                  "t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                                  "wilcoxon_p": wilcoxon_p,
                                  "cohen_dz": mean / std if std > 0 else float("nan"),
                              }
                          )

          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_state_recombination_summary.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-state-recombination-aggregate
          path: |
            results/generated/flyvis_type_pair_state_recombination.csv
            results/generated/flyvis_type_pair_state_recombination_summary.csv
