name: FlyVis topology credit geometry

on:
  push:
    paths:
      - .github/workflows/flyvis-topology-credit-geometry.yml
      - scripts/diagnose_flyvis_topology_credit_geometry.py
      - scripts/run_flyvis_temporal_credit_projection.py
      - scripts/run_flyvis_temporal_oracle_interpolation.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        extent: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Compare biological and rewired credit geometry
        run: >-
          uv run python scripts/diagnose_flyvis_topology_credit_geometry.py
          --extent ${{ matrix.extent }}
          --seeds 20
          --repeats 5
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta 0.03
          --out results/generated/flyvis_topology_credit_geometry_extent_${{ matrix.extent }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-topology-credit-geometry-extent-${{ matrix.extent }}
          path: results/generated/flyvis_topology_credit_geometry_extent_${{ matrix.extent }}.csv
