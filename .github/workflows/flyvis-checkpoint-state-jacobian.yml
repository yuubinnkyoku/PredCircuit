name: FlyVis checkpoint state Jacobian

on:
  push:
    paths:
      - "scripts/diagnose_flyvis_checkpoint_state_jacobian.py"
      - ".github/workflows/flyvis-checkpoint-state-jacobian.yml"
  workflow_dispatch:

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Diagnose state Jacobian for seed ${{ matrix.seed }}
        run: >-
          uv run python scripts/diagnose_flyvis_checkpoint_state_jacobian.py
          --seed ${{ matrix.seed }}
          --learning-rate 160
          --train-nudge-steps 2
          --max-update 0.05
          --test-repeats 8
          --out results/generated/flyvis_checkpoint_state_jacobian_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-checkpoint-state-jacobian-seed${{ matrix.seed }}
          path: results/generated/flyvis_checkpoint_state_jacobian_seed${{ matrix.seed }}.csv
