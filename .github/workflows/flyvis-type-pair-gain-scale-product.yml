name: FlyVis type-pair gain-scale product holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-gain-scale-product-1650-1669"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed:
          - 1650
          - 1651
          - 1652
          - 1653
          - 1654
          - 1655
          - 1656
          - 1657
          - 1658
          - 1659
          - 1660
          - 1661
          - 1662
          - 1663
          - 1664
          - 1665
          - 1666
          - 1667
          - 1668
          - 1669
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run gain-scale product holdout for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_gain_scale_product.py \
            --seed ${{ matrix.seed }} \
            --init-scales 0.10,0.12,0.14,0.16 \
            --horizons 160,200 \
            --eval-jitter-base 10900000 \
            --out results/generated/flyvis_type_pair_gain_scale_product_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-gain-scale-product-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_gain_scale_product_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-gain-scale-product-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate gain-scale product holdout
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 2560:
              raise RuntimeError(f"expected 2560 rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite gain-scale product result detected")
          if frame["seed"].nunique() != 20:
              raise RuntimeError("expected 20 unique seeds")

          # At scale 0.10, iso40 is mathematically identical to standard (coefficient 4).
          parity = frame[frame["init_scale"] == 0.10].pivot_table(
              index=["seed", "horizon", "eval_rep"],
              columns="rule",
              values=["cross_entropy", "accuracy", "hard_margin", "soft_margin", "weight_norm"],
          )
          for metric in ("cross_entropy", "accuracy", "hard_margin", "soft_margin", "weight_norm"):
              error = np.max(np.abs(parity[(metric, "standard")] - parity[(metric, "iso40")]))
              if error > 1e-10:
                  raise RuntimeError(f"standard/iso40 parity failure at scale 0.10 for {metric}: {error}")

          frame.to_csv(
              "results/generated/flyvis_type_pair_gain_scale_product.csv",
              index=False,
          )

          metrics = (
              "cross_entropy",
              "accuracy",
              "hard_margin",
              "soft_margin",
              "weight_norm",
          )
          per_seed = frame.groupby(
              ["seed", "init_scale", "rule", "horizon"], as_index=False
          )[list(metrics)].mean()
          rows = []
          comparisons = (
              ("standard", "local"),
              ("iso32", "local"),
              ("iso40", "local"),
              ("iso32", "standard"),
              ("iso40", "standard"),
          )
          for scale in sorted(per_seed["init_scale"].unique()):
              for horizon in sorted(per_seed["horizon"].unique()):
                  subset = per_seed[
                      (per_seed["init_scale"] == scale)
                      & (per_seed["horizon"] == horizon)
                  ]
                  for lhs_rule, rhs_rule in comparisons:
                      lhs = subset[subset["rule"] == lhs_rule].set_index("seed").sort_index()
                      rhs = subset[subset["rule"] == rhs_rule].set_index("seed").sort_index()
                      if not lhs.index.equals(rhs.index) or len(lhs) != 20:
                          raise RuntimeError("paired seed mismatch")
                      for metric in metrics:
                          diff = lhs[metric].to_numpy(float) - rhs[metric].to_numpy(float)
                          mean = float(diff.mean())
                          std = float(diff.std(ddof=1))
                          se = std / np.sqrt(len(diff))
                          if std > 0.0:
                              ci_low, ci_high = stats.t.interval(
                                  0.95, len(diff) - 1, loc=mean, scale=se
                              )
                              p_value = float(
                                  stats.ttest_rel(
                                      lhs[metric].to_numpy(float),
                                      rhs[metric].to_numpy(float),
                                  ).pvalue
                              )
                              dz = mean / std
                          else:
                              ci_low = ci_high = mean
                              p_value = 1.0
                              dz = 0.0
                          rows.append(
                              {
                                  "init_scale": float(scale),
                                  "horizon": int(horizon),
                                  "lhs_rule": lhs_rule,
                                  "rhs_rule": rhs_rule,
                                  "metric": metric,
                                  "n": len(diff),
                                  "mean_difference": mean,
                                  "ci_low": float(ci_low),
                                  "ci_high": float(ci_high),
                                  "p_value": p_value,
                                  "cohen_dz": float(dz),
                                  "positive_seeds": int((diff > 0).sum()),
                                  "negative_seeds": int((diff < 0).sum()),
                              }
                          )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_gain_scale_product_paired.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-gain-scale-product-aggregate
          path: |
            results/generated/flyvis_type_pair_gain_scale_product.csv
            results/generated/flyvis_type_pair_gain_scale_product_paired.csv
