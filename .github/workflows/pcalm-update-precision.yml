name: PC-ALM update precision holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/pcalm-update-precision.yml]

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [700,701,702,703,704,705,706,707,708,709,710,711,712,713,714,715,716,717,718,719]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/diagnose_pcalm_update_precision.py --seed ${{ matrix.seed }} --out results/generated/pcalm_update_precision_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-update-precision-seed-${{ matrix.seed }}
          path: results/generated/pcalm_update_precision_seed${{ matrix.seed }}.csv
          if-no-files-found: error
  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-update-precision-seed-*
          path: artifacts
          merge-multiple: true
      - run: uv run python scripts/aggregate_pcalm_update_precision.py --input artifacts --out results/generated/pcalm_update_precision_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-update-precision-aggregate
          path: results/generated/pcalm_update_precision_*.csv
          if-no-files-found: error
