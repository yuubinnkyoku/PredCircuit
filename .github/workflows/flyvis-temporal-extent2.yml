name: FlyVis temporal local PC extent-2 replication

on:
  push:
    paths:
      - .github/workflows/flyvis-temporal-extent2.yml
      - scripts/run_flyvis_retinotopic_temporal_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  extent2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Replicate online local PC on extent 2
        run: >-
          uv run python scripts/run_flyvis_retinotopic_temporal_contrastive.py
          --extent 2
          --seeds 10
          --epochs 100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta 0.3
          --weight-lr 10.0
          --test-repeats 8
          --out results/generated/flyvis_temporal_local_extent2.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-temporal-local-extent2
          path: results/generated/flyvis_temporal_local_extent2.csv
