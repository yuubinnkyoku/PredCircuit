name: FlyVis branched residual structure

on:
  push:
    paths:
      - .github/workflows/flyvis-branched-residual-structure.yml
      - scripts/run_flyvis_branched_residual_structure.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rule:
          - local
          - type_pair_edge_permuted_residual
          - offset_edge_permuted_residual
          - source_position_edge_permuted_residual
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train matched residual control ${{ matrix.rule }}
        run: >-
          uv run python scripts/run_flyvis_branched_residual_structure.py
          --rule ${{ matrix.rule }}
          --seeds 5
          --epochs 100
          --frames 7
          --frame-steps 2
          --nudge-steps 16
          --step-size 0.015
          --beta 0.03
          --learning-rate 0.01
          --beta1 0.9
          --beta2 0.999
          --adam-epsilon 1e-8
          --test-repeats 8
          --out results/generated/flyvis_branched_residual_structure_${{ matrix.rule }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branched-residual-structure-${{ matrix.rule }}
          path: results/generated/flyvis_branched_residual_structure_${{ matrix.rule }}.csv
