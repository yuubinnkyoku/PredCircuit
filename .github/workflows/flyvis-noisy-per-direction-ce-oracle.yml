name: FlyVis noisy per-direction CE oracle

on:
  push:
    paths:
      - .github/workflows/flyvis-noisy-per-direction-ce-oracle.yml
      - scripts/run_flyvis_noisy_per_direction_ce_oracle.py
      - scripts/run_flyvis_exact_pc_gradient.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  noisy-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target_cosine: [1.0, 0.9999, 0.999, 0.995, 0.99, 0.98]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train with per-direction oracle cosine ${{ matrix.target_cosine }}
        run: >-
          uv run python scripts/run_flyvis_noisy_per_direction_ce_oracle.py
          --seeds 5
          --target-cosine ${{ matrix.target_cosine }}
          --epochs 100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --learning-rate 0.01
          --train-repeats 4
          --test-repeats 8
          --out results/generated/flyvis_noisy_per_direction_ce_oracle_${{ matrix.target_cosine }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-noisy-per-direction-ce-oracle-${{ matrix.target_cosine }}
          path: results/generated/flyvis_noisy_per_direction_ce_oracle_${{ matrix.target_cosine }}.csv
