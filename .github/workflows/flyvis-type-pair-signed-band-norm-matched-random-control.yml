name: FlyVis signed-band norm-matched random control

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-signed-band-norm-matched-random-control-1380-1399"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1380, 1381, 1382, 1383, 1384, 1385, 1386, 1387, 1388, 1389, 1390, 1391, 1392, 1393, 1394, 1395, 1396, 1397, 1398, 1399]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run norm-matched random control for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_signed_band_norm_matched_random_control.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_signed_band_norm_matched_random_control_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-signed-band-norm-matched-random-control-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_signed_band_norm_matched_random_control_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-signed-band-norm-matched-random-control-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate norm-matched random control
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if not frame["finite"].all():
              raise RuntimeError("non-finite norm-matched control detected")
          frame.to_csv(
              "results/generated/flyvis_type_pair_signed_band_norm_matched_random_control.csv",
              index=False,
          )

          metrics = (
              "signed_minus_matched_cross_entropy",
              "signed_minus_matched_accuracy",
              "signed_minus_matched_hard_margin",
              "signed_minus_matched_soft_margin",
              "signed_minus_rho04_cross_entropy",
              "signed_minus_rho04_accuracy",
              "signed_minus_rho04_hard_margin",
              "signed_minus_rho04_soft_margin",
              "target_difference_norm",
              "matched_difference_norm",
              "relative_norm_error",
              "selection_overlap_fraction",
              "boundary_group_count",
              "selected_group_count",
          )
          per_seed = frame.groupby(["seed", "init_mode", "horizon"], as_index=False)[list(metrics)].mean()
          rows = []
          for (mode, horizon), subset in per_seed.groupby(["init_mode", "horizon"]):
              for metric in metrics:
                  values = subset[metric].to_numpy(float)
                  mean = float(values.mean())
                  std = float(values.std(ddof=1))
                  if std > 0.0:
                      ci_low, ci_high = stats.t.interval(
                          0.95,
                          len(values) - 1,
                          loc=mean,
                          scale=std / np.sqrt(len(values)),
                      )
                      t_p = float(stats.ttest_1samp(values, 0.0).pvalue)
                      dz = mean / std
                  else:
                      ci_low = mean
                      ci_high = mean
                      t_p = 1.0 if mean == 0.0 else 0.0
                      dz = float("nan")
                  rows.append(
                      {
                          "init_mode": mode,
                          "horizon": int(horizon),
                          "metric": metric,
                          "n": len(values),
                          "mean": mean,
                          "ci_low": float(ci_low),
                          "ci_high": float(ci_high),
                          "positive": int((values > 0).sum()),
                          "t_p": t_p,
                          "cohen_dz": dz,
                      }
                  )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_signed_band_norm_matched_random_control_summary.csv",
              index=False,
          )

          diagnostics = (
              frame.groupby(["init_mode", "horizon"], as_index=False)
              .agg(
                  finite_fraction=("finite", "mean"),
                  degenerate_fraction=("degenerate_match", "mean"),
                  mean_relative_norm_error=("relative_norm_error", "mean"),
                  max_relative_norm_error=("relative_norm_error", "max"),
                  mean_selection_overlap=("selection_overlap_fraction", "mean"),
              )
          )
          diagnostics.to_csv(
              "results/generated/flyvis_type_pair_signed_band_norm_matched_random_control_diagnostics.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-signed-band-norm-matched-random-control-aggregate
          path: |
            results/generated/flyvis_type_pair_signed_band_norm_matched_random_control.csv
            results/generated/flyvis_type_pair_signed_band_norm_matched_random_control_summary.csv
            results/generated/flyvis_type_pair_signed_band_norm_matched_random_control_diagnostics.csv
