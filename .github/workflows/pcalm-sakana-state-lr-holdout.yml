name: PC-ALM Sakana state_lr holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-sakana-state-lr-holdout.yml
      - scripts/diagnose_pcalm_sakana_state_lr.py
      - src/predcircuit/magnitude_control.py
      - src/predcircuit/pcalm.py

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [980, 981, 982, 983, 984, 985, 986, 987, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 999]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run python scripts/diagnose_pcalm_sakana_state_lr.py
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_sakana_state_lr_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-sakana-state-lr-seed-${{ matrix.seed }}
          path: results/generated/pcalm_sakana_state_lr_seed${{ matrix.seed }}.csv
          if-no-files-found: error
