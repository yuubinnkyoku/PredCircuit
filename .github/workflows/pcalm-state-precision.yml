name: PC-ALM state precision holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/pcalm-state-precision.yml]

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [600,601,602,603,604,605,606,607,608,609,610,611,612,613,614,615,616,617,618,619]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/diagnose_pcalm_state_precision.py --seed ${{ matrix.seed }} --out results/generated/pcalm_state_precision_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-state-precision-seed-${{ matrix.seed }}
          path: results/generated/pcalm_state_precision_seed${{ matrix.seed }}.csv
          if-no-files-found: error
  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-state-precision-seed-*
          path: artifacts
          merge-multiple: true
      - run: uv run python scripts/aggregate_pcalm_state_precision.py --input artifacts --out results/generated/pcalm_state_precision_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-state-precision-aggregate
          path: results/generated/pcalm_state_precision_*.csv
          if-no-files-found: error
