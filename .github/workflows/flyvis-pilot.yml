name: FlyVis type pilot

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/flyvis-pilot.yml

jobs:
  inference-pilot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        step-size: [0.01, 0.02, 0.03, 0.05, 0.08]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Run FlyVis type-level inference pilot
        run: >-
          uv run python scripts/run_flyvis_inference.py
          --seeds 20
          --samples 64
          --steps 100
          --step-size ${{ matrix.step-size }}
          --out results/generated/flyvis_type_inference_${{ matrix.step-size }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-inference-${{ matrix.step-size }}
          path: results/generated/flyvis_type_inference_${{ matrix.step-size }}.csv
          if-no-files-found: error
