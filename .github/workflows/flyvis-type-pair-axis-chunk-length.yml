name: FlyVis type-pair axis chunk length

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_flyvis_type_pair_axis_chunk_length.py"
      - ".github/workflows/flyvis-type-pair-axis-chunk-length.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [320, 321, 322, 323, 324, 325, 326, 327, 328, 329]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Measure chunk-length response
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_axis_chunk_length.py \
            --seed ${{ matrix.seed }} \
            --shuffle-seed $((820000 + ${{ matrix.seed }})) \
            --out results/generated/flyvis_type_pair_axis_chunk_length_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-axis-chunk-length-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_axis_chunk_length_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-axis-chunk-length-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate chunk-length response
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path

          import numpy as np
          import pandas as pd
          from scipy import stats

          frame = pd.concat(
              [pd.read_csv(path) for path in sorted(Path("artifacts").glob("*.csv"))],
              ignore_index=True,
          )
          if len(frame) != 90:
              raise RuntimeError(f"expected 90 rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite chunk-length run detected")
          finite_metrics = frame[
              [
                  "cross_entropy_after",
                  "accuracy_after",
                  "margin_after",
                  "mean_post_weight_norm_error",
                  "mean_post_bias_vector_error",
              ]
          ]
          if not np.isfinite(finite_metrics.to_numpy()).all():
              raise RuntimeError("non-finite chunk-length metric detected")
          frame.to_csv(
              "results/generated/flyvis_type_pair_axis_chunk_length.csv",
              index=False,
          )

          wide = frame.pivot(index="seed", columns="condition")

          def paired_row(label, delta):
              n = len(delta)
              mean = float(np.mean(delta))
              std = float(np.std(delta, ddof=1))
              ci = stats.t.interval(0.95, n - 1, loc=mean, scale=std / np.sqrt(n))
              try:
                  wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
              except ValueError:
                  wilcoxon_p = 1.0
              return {
                  "comparison": label,
                  "n": n,
                  "mean_gain": mean,
                  "ci95_low": float(ci[0]),
                  "ci95_high": float(ci[1]),
                  "improved_seeds": int(np.sum(delta > 0)),
                  "paired_t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                  "wilcoxon_p": wilcoxon_p,
                  "cohen_dz": mean / std if std > 0 else float("nan"),
              }

          schedules = ("chunk1", "chunk5", "chunk25", "chunk50")
          rows = []
          axis_ce_gains = {}
          for schedule in schedules:
              type_name = f"type_{schedule}"
              shuffle_name = f"shuffle_{schedule}"
              ce_gain = (
                  wide["cross_entropy_after"][shuffle_name].to_numpy()
                  - wide["cross_entropy_after"][type_name].to_numpy()
              )
              axis_ce_gains[schedule] = ce_gain
              rows.append(paired_row(f"axis_ce:{schedule}", ce_gain))
              for metric in ("accuracy_after", "margin_after"):
                  gain = (
                      wide[metric][type_name].to_numpy()
                      - wide[metric][shuffle_name].to_numpy()
                  )
                  rows.append(paired_row(f"axis_{metric}:{schedule}", gain))

          for left, right in (
              ("chunk5", "chunk1"),
              ("chunk25", "chunk5"),
              ("chunk50", "chunk25"),
              ("chunk50", "chunk1"),
          ):
              rows.append(
                  paired_row(
                      f"axis_ce_did:{left}-{right}",
                      axis_ce_gains[left] - axis_ce_gains[right],
                  )
              )

          summary = pd.DataFrame(rows)
          summary.to_csv(
              "results/generated/flyvis_type_pair_axis_chunk_length_summary.csv",
              index=False,
          )
          print(summary.to_string(index=False))
          print("\nGeometry by chunk length:")
          print(
              frame[frame["condition"] != "local"]
              .groupby(["schedule", "grouping"])[
                  [
                      "pulse_count",
                      "mean_pulse_relative_direction_change",
                      "mean_pulse_angle_match_error",
                      "mean_pulse_effective_gain",
                      "mean_pulse_edge_clip_fraction",
                      "mean_post_weight_norm_error",
                      "mean_post_bias_vector_error",
                  ]
              ]
              .mean()
              .to_string()
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-axis-chunk-length-aggregate
          path: |
            results/generated/flyvis_type_pair_axis_chunk_length.csv
            results/generated/flyvis_type_pair_axis_chunk_length_summary.csv
