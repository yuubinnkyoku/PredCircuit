name: FlyVis type-pair dynamic gradient geometry cohort

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-dynamic-gradient-geometry-cohort-2250-2329"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [2250, 2251, 2252, 2253, 2254, 2255, 2256, 2257, 2258, 2259, 2260, 2261, 2262, 2263, 2264, 2265, 2266, 2267, 2268, 2269, 2270, 2271, 2272, 2273, 2274, 2275, 2276, 2277, 2278, 2279, 2280, 2281, 2282, 2283, 2284, 2285, 2286, 2287, 2288, 2289, 2310, 2311, 2312, 2313, 2314, 2315, 2316, 2317, 2318, 2319, 2320, 2321, 2322, 2323, 2324, 2325, 2326, 2327, 2328, 2329]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Measure dynamic geometry for seed ${{ matrix.seed }}
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_dynamic_gradient_geometry.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_dynamic_gradient_geometry_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-dynamic-gradient-geometry-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_dynamic_gradient_geometry_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-dynamic-gradient-geometry-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate dynamic cohort contrast
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 60:
              raise RuntimeError(f"expected 60 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if frame["seed"].nunique() != 60 or not frame["finite"].all():
              raise RuntimeError("incomplete or non-finite dynamic geometry diagnostic")
          if not (frame.groupby("seed").size() == 20).all():
              raise RuntimeError("expected 20 epochs per seed")
          if float(frame["l2_match_relative_error"].max()) >= 2e-5:
              raise RuntimeError("L2 matching error exceeds tolerance")
          frame["cohort"] = np.where(frame["seed"].between(2250, 2289), "positive_2250_2289", "null_2310_2329")
          frame.to_csv("results/generated/flyvis_type_pair_dynamic_gradient_geometry_cohort.csv", index=False)

          metrics = [
              "ce_grad_dot_redistribution",
              "hard_grad_dot_redistribution",
              "soft_grad_dot_redistribution",
              "soft_minus_global_next_ce",
              "soft_minus_global_next_hard",
              "soft_minus_global_next_soft",
              "candidate_group_fraction",
              "candidate_edge_fraction",
              "redistribution_l2",
          ]
          derived = []
          for seed, sub in frame.groupby("seed", sort=True):
              sub = sub.sort_values("horizon")
              row = {"seed": int(seed), "cohort": sub["cohort"].iloc[0]}
              x = sub["horizon"].to_numpy(float)
              for metric in metrics:
                  y = sub[metric].to_numpy(float)
                  row[f"{metric}__mean"] = float(y.mean())
                  row[f"{metric}__sum"] = float(y.sum())
                  row[f"{metric}__std"] = float(y.std(ddof=1))
                  row[f"{metric}__slope"] = float(np.polyfit(x, y, 1)[0])
                  row[f"{metric}__positive_fraction"] = float((y > 0).mean())
              derived.append(row)
          derived = pd.DataFrame(derived)
          derived.to_csv("results/generated/flyvis_type_pair_dynamic_gradient_geometry_seed_summary.csv", index=False)

          rows = []
          for metric in [c for c in derived.columns if c not in {"seed", "cohort"}]:
              a = derived.loc[derived.cohort == "positive_2250_2289", metric].to_numpy(float)
              b = derived.loc[derived.cohort == "null_2310_2329", metric].to_numpy(float)
              diff = float(a.mean() - b.mean())
              test = stats.ttest_ind(a, b, equal_var=False)
              pooled = ((len(a)-1)*a.var(ddof=1)+(len(b)-1)*b.var(ddof=1))/(len(a)+len(b)-2)
              d = diff / np.sqrt(pooled) if pooled > 0 else 0.0
              rows.append({
                  "metric": metric,
                  "mean_positive": float(a.mean()),
                  "mean_null": float(b.mean()),
                  "positive_minus_null": diff,
                  "welch_p": float(test.pvalue) if np.isfinite(test.pvalue) else 1.0,
                  "cohen_d": float(d) if np.isfinite(d) else 0.0,
              })
          summary = pd.DataFrame(rows).sort_values("welch_p")
          p = summary["welch_p"].to_numpy()
          order = np.argsort(p)
          ranked = p[order] * len(p) / np.arange(1, len(p)+1)
          adjusted = np.empty_like(ranked)
          adjusted[order] = np.minimum.accumulate(ranked[::-1])[::-1]
          summary["fdr_bh"] = np.clip(adjusted, 0.0, 1.0)
          summary.to_csv("results/generated/flyvis_type_pair_dynamic_gradient_geometry_summary.csv", index=False)
          print(summary.head(30).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-dynamic-gradient-geometry-cohort-aggregate
          path: |
            results/generated/flyvis_type_pair_dynamic_gradient_geometry_cohort.csv
            results/generated/flyvis_type_pair_dynamic_gradient_geometry_seed_summary.csv
            results/generated/flyvis_type_pair_dynamic_gradient_geometry_summary.csv
