name: PC-ALM matched-credit minimum budget

# Fresh 20-seed holdout for the current depth-32 operating point.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-matched-credit-budget.yml
      - scripts/diagnose_pcalm_matched_credit_budget.py
      - scripts/aggregate_pcalm_matched_credit_budget.py
      - src/predcircuit/pcalm.py

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [900,901,902,903,904,905,906,907,908,909,910,911,912,913,914,915,916,917,918,919]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run python scripts/diagnose_pcalm_matched_credit_budget.py
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_matched_credit_budget_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-matched-credit-budget-seed-${{ matrix.seed }}
          path: results/generated/pcalm_matched_credit_budget_seed${{ matrix.seed }}.csv
          if-no-files-found: error
  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-matched-credit-budget-seed-*
          path: artifacts
          merge-multiple: true
      - run: >-
          uv run python scripts/aggregate_pcalm_matched_credit_budget.py
          --input artifacts
          --detail-out results/generated/pcalm_matched_credit_minimums.csv
          --summary-out results/generated/pcalm_matched_credit_summary.csv
          --curve-out results/generated/pcalm_matched_credit_common_budget.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-matched-credit-budget-aggregate
          path: |
            results/generated/pcalm_matched_credit_minimums.csv
            results/generated/pcalm_matched_credit_summary.csv
            results/generated/pcalm_matched_credit_common_budget.csv
          if-no-files-found: error
