name: FlyVis type-pair axis pulse frequency

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_flyvis_type_pair_axis_pulse_frequency.py"
      - ".github/workflows/flyvis-type-pair-axis-pulse-frequency.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [270, 271, 272, 273, 274, 275, 276, 277, 278, 279]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Measure type-pair pulse-frequency response
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_axis_pulse_frequency.py \
            --seed ${{ matrix.seed }} \
            --shuffle-seed $((770000 + ${{ matrix.seed }})) \
            --out results/generated/flyvis_type_pair_axis_pulse_frequency_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-axis-pulse-frequency-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_axis_pulse_frequency_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-axis-pulse-frequency-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate pulse-frequency response
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path

          import numpy as np
          import pandas as pd
          from scipy import stats

          frame = pd.concat(
              [pd.read_csv(path) for path in sorted(Path("artifacts").glob("*.csv"))],
              ignore_index=True,
          )
          expected = 10 * 17
          if len(frame) != expected:
              raise RuntimeError(f"expected {expected} rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite pulse-frequency run detected")
          finite_metrics = frame[
              [
                  "cross_entropy_after",
                  "accuracy_after",
                  "margin_after",
                  "mean_post_weight_norm_error",
                  "mean_post_bias_vector_error",
              ]
          ]
          if not np.isfinite(finite_metrics.to_numpy()).all():
              raise RuntimeError("non-finite pulse-frequency metric detected")
          frame.to_csv(
              "results/generated/flyvis_type_pair_axis_pulse_frequency.csv",
              index=False,
          )

          rows = []
          for interval in (1, 5, 20, 100):
              subset = frame[
                  (frame["pulse_interval"] == interval) | (frame["condition"] == "local")
              ]
              wide = subset.pivot(index="seed", columns="condition")
              for suffix in ("neg", "pos"):
                  type_name = f"type_{suffix}_every{interval}"
                  shuffle_name = f"shuffle_{suffix}_every{interval}"
                  comparisons = (
                      (type_name, shuffle_name),
                      (type_name, "local"),
                      (shuffle_name, "local"),
                  )
                  for treatment, reference in comparisons:
                      for metric, sign in (
                          ("cross_entropy_after", -1.0),
                          ("accuracy_after", 1.0),
                          ("margin_after", 1.0),
                      ):
                          delta = sign * (
                              wide[metric][treatment].to_numpy()
                              - wide[metric][reference].to_numpy()
                          )
                          n = len(delta)
                          mean = float(np.mean(delta))
                          std = float(np.std(delta, ddof=1))
                          ci = stats.t.interval(
                              0.95,
                              n - 1,
                              loc=mean,
                              scale=std / np.sqrt(n),
                          )
                          try:
                              wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
                          except ValueError:
                              wilcoxon_p = 1.0
                          rows.append(
                              {
                                  "pulse_interval": interval,
                                  "treatment": treatment,
                                  "reference": reference,
                                  "metric": metric,
                                  "n": n,
                                  "mean_gain": mean,
                                  "ci95_low": float(ci[0]),
                                  "ci95_high": float(ci[1]),
                                  "improved_seeds": int(np.sum(delta > 0)),
                                  "paired_t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                                  "wilcoxon_p": wilcoxon_p,
                                  "cohen_dz": mean / std if std > 0 else float("nan"),
                              }
                          )
          summary = pd.DataFrame(rows)
          summary.to_csv(
              "results/generated/flyvis_type_pair_axis_pulse_frequency_summary.csv",
              index=False,
          )
          print(
              summary[
                  (summary["reference"].str.startswith("shuffle"))
                  & summary["metric"].isin(["cross_entropy_after", "margin_after"])
              ].to_string(index=False)
          )
          print("\nGeometry by condition:")
          print(
              frame[frame["condition"] != "local"]
              .groupby(["pulse_interval", "grouping", "sign"])[
                  [
                      "pulse_count",
                      "mean_pulse_relative_direction_change",
                      "mean_pulse_angle_match_error",
                      "mean_pulse_effective_gain",
                      "mean_pulse_edge_clip_fraction",
                      "mean_post_weight_norm_error",
                      "mean_post_bias_vector_error",
                  ]
              ]
              .mean()
              .to_string()
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-axis-pulse-frequency-aggregate
          path: |
            results/generated/flyvis_type_pair_axis_pulse_frequency.csv
            results/generated/flyvis_type_pair_axis_pulse_frequency_summary.csv
