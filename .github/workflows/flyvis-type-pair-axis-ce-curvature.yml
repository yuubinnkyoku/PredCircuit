name: FlyVis type-pair axis CE curvature

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_flyvis_type_pair_axis_ce_curvature.py"
      - ".github/workflows/flyvis-type-pair-axis-ce-curvature.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [250, 251, 252, 253, 254, 255, 256, 257, 258, 259]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Measure finite-step CE curvature
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_axis_ce_curvature.py \
            --seed ${{ matrix.seed }} \
            --shuffle-seed $((750000 + ${{ matrix.seed }})) \
            --out results/generated/flyvis_type_pair_axis_ce_curvature_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-axis-ce-curvature-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_axis_ce_curvature_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-axis-ce-curvature-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate paired curvature
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path

          import numpy as np
          import pandas as pd
          from scipy import stats

          frame = pd.concat(
              [pd.read_csv(path) for path in sorted(Path("artifacts").glob("*.csv"))],
              ignore_index=True,
          )
          expected = 10 * 3 * 5 * 3 * 2
          if len(frame) != expected:
              raise RuntimeError(f"expected {expected} rows, got {len(frame)}")
          numeric = frame.select_dtypes(include=[np.number])
          if not np.isfinite(numeric.to_numpy()).all():
              raise RuntimeError("non-finite curvature diagnostic detected")
          frame.to_csv("results/generated/flyvis_type_pair_axis_ce_curvature.csv", index=False)

          comparisons = (
              ("type_neg", "shuffle_angle_neg"),
              ("type_pos", "shuffle_angle_pos"),
          )
          metrics = ("one_sided_improvement", "central_slope", "directional_curvature")
          rows = []
          for checkpoint in (0, 20, 100):
              for objective in ("final_ce", "temporal_ce"):
                  for relative_step in (0.001, 0.003, 0.01):
                      subset = frame[
                          (frame["checkpoint"] == checkpoint)
                          & (frame["objective"] == objective)
                          & np.isclose(frame["relative_step"], relative_step)
                      ]
                      wide = subset.pivot(index="seed", columns="condition")
                      for treatment, reference in comparisons:
                          for metric in metrics:
                              delta = (
                                  wide[metric][treatment].to_numpy()
                                  - wide[metric][reference].to_numpy()
                              )
                              n = len(delta)
                              mean = float(np.mean(delta))
                              std = float(np.std(delta, ddof=1))
                              ci = stats.t.interval(
                                  0.95,
                                  n - 1,
                                  loc=mean,
                                  scale=std / np.sqrt(n),
                              )
                              try:
                                  wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
                              except ValueError:
                                  wilcoxon_p = 1.0
                              rows.append(
                                  {
                                      "checkpoint": checkpoint,
                                      "objective": objective,
                                      "relative_step": relative_step,
                                      "treatment": treatment,
                                      "reference": reference,
                                      "metric": metric,
                                      "n": n,
                                      "mean_delta": mean,
                                      "ci95_low": float(ci[0]),
                                      "ci95_high": float(ci[1]),
                                      "positive_seeds": int(np.sum(delta > 0)),
                                      "paired_t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                                      "wilcoxon_p": wilcoxon_p,
                                      "cohen_dz": mean / std if std > 0 else float("nan"),
                                  }
                              )
          summary = pd.DataFrame(rows)
          summary.to_csv(
              "results/generated/flyvis_type_pair_axis_ce_curvature_summary.csv",
              index=False,
          )
          print(
              summary[
                  (summary["objective"] == "final_ce")
                  & (summary["metric"].isin(["one_sided_improvement", "directional_curvature"]))
              ].to_string(index=False)
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-axis-ce-curvature-aggregate
          path: |
            results/generated/flyvis_type_pair_axis_ce_curvature.csv
            results/generated/flyvis_type_pair_axis_ce_curvature_summary.csv
