name: FlyVis branched beta alignment

on:
  push:
    paths:
      - .github/workflows/flyvis-branch-beta-alignment.yml
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_temporal_classification_nudge.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  beta-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        beta: [0.3, 0.1, 0.03, 0.01, 0.003, 0.001]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Measure branched credit at beta ${{ matrix.beta }}
        run: >-
          uv run python scripts/diagnose_flyvis_branch_nudge_alignment.py
          --extent 2
          --seeds 20
          --repeats 1
          --frames 7
          --frame-steps 2
          --nudge-steps 2
          --step-size 0.015
          --beta ${{ matrix.beta }}
          --out results/generated/flyvis_branch_beta_alignment_${{ matrix.beta }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branch-beta-alignment-${{ matrix.beta }}
          path: results/generated/flyvis_branch_beta_alignment_${{ matrix.beta }}.csv
