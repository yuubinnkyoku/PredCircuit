name: Residual packer RTL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rtl/residual_packer_1to8.sv
      - rtl/tb_residual_packer_1to8.sv
      - .github/workflows/residual-packer.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Simulate continuous scalar stream
        run: |
          mkdir -p build/rtl
          iverilog -g2012 -Wall -s tb_residual_packer_1to8 -o build/rtl/tb_residual_packer_1to8 rtl/residual_packer_1to8.sv rtl/tb_residual_packer_1to8.sv
          vvp build/rtl/tb_residual_packer_1to8
      - name: Synthesize XC7 resource cost
        run: |
          yosys -p 'read_verilog -sv rtl/residual_packer_1to8.sv; synth_xilinx -family xc7 -top residual_packer_1to8; stat' 2>&1 | tee build/rtl/residual_packer_1to8_xc7.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-packer-synthesis
          path: build/rtl/*.log
          if-no-files-found: error
