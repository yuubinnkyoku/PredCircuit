name: FlyVis exact PC gradient control

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/flyvis-exact-pc-gradient.yml
      - src/predcircuit/model.py
      - src/predcircuit/flyvis_retinotopy.py
      - scripts/run_flyvis_gradient_alignment.py
      - scripts/run_flyvis_exact_pc_gradient.py
      - scripts/run_flyvis_retinotopic_contrastive.py

jobs:
  exact-gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        learning_rate: [0.001, 0.003, 0.01, 0.03]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train through exact unrolled PC dynamics
        run: >-
          uv run python scripts/run_flyvis_exact_pc_gradient.py
          --extent 1
          --seeds 3
          --epochs 100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --learning-rate ${{ matrix.learning_rate }}
          --train-repeats 4
          --test-repeats 8
          --out results/generated/flyvis_exact_pc_gradient_${{ matrix.learning_rate }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-exact-pc-gradient-${{ matrix.learning_rate }}
          path: results/generated/flyvis_exact_pc_gradient_${{ matrix.learning_rate }}.csv
          if-no-files-found: error
