name: FlyVis strict residual SGD

on:
  push:
    paths:
      - "scripts/run_flyvis_strict_residual_sgd.py"
      - ".github/workflows/flyvis-strict-residual-sgd.yml"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rule:
          - local
          - type_pair_edge_permuted
          - source_position_edge_permuted
          - bias_permuted
          - type_pair_mean
        learning_rate: [20, 80]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Train SGD ${{ matrix.rule }} lr=${{ matrix.learning_rate }}
        run: >-
          uv run python scripts/run_flyvis_strict_residual_sgd.py
          --rule ${{ matrix.rule }}
          --seeds 3
          --epochs 100
          --nudge-steps 16
          --learning-rate ${{ matrix.learning_rate }}
          --test-repeats 8
          --out results/generated/flyvis_strict_residual_sgd_${{ matrix.rule }}_lr${{ matrix.learning_rate }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-strict-residual-sgd-${{ matrix.rule }}-lr${{ matrix.learning_rate }}
          path: results/generated/flyvis_strict_residual_sgd_${{ matrix.rule }}_lr${{ matrix.learning_rate }}.csv
