name: FlyVis coordinate credit SNR

on:
  push:
    paths:
      - .github/workflows/flyvis-coordinate-snr.yml
      - scripts/diagnose_flyvis_coordinate_snr.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_temporal_credit_projection.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  coordinate-snr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: nudge-1
            nudge_steps: 1
            beta: 0.03
          - label: nudge-2
            nudge_steps: 2
            beta: 0.03
          - label: nudge-4
            nudge_steps: 4
            beta: 0.03
          - label: nudge-8
            nudge_steps: 8
            beta: 0.03
          - label: nudge-16
            nudge_steps: 16
            beta: 0.03
          - label: nudge-32
            nudge_steps: 32
            beta: 0.03
          - label: beta-0.001
            nudge_steps: 2
            beta: 0.001
          - label: beta-0.003
            nudge_steps: 2
            beta: 0.003
          - label: beta-0.01
            nudge_steps: 2
            beta: 0.01
          - label: beta-0.1
            nudge_steps: 2
            beta: 0.1
          - label: beta-0.3
            nudge_steps: 2
            beta: 0.3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Measure coordinate credit SNR
        run: >-
          uv run python scripts/diagnose_flyvis_coordinate_snr.py
          --extent 2
          --seeds 20
          --frames 7
          --frame-steps 2
          --nudge-steps ${{ matrix.nudge_steps }}
          --step-size 0.015
          --beta ${{ matrix.beta }}
          --adam-epsilon 1e-8
          --out results/generated/flyvis_coordinate_snr_${{ matrix.label }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-coordinate-snr-${{ matrix.label }}
          path: results/generated/flyvis_coordinate_snr_${{ matrix.label }}.csv
