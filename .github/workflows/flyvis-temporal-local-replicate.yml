name: FlyVis temporal local replication

on:
  push:
    paths:
      - .github/workflows/flyvis-temporal-local-replicate.yml
      - scripts/run_flyvis_retinotopic_temporal_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lr: ["3.0", "10.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Replicate online temporal local PC across twenty seeds
        run: >-
          uv run python scripts/run_flyvis_retinotopic_temporal_contrastive.py
          --extent 1
          --seeds 20
          --epochs 100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta 0.3
          --weight-lr ${{ matrix.lr }}
          --test-repeats 8
          --out results/generated/flyvis_temporal_local_replicate_${{ matrix.lr }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-temporal-local-replicate-${{ matrix.lr }}
          path: results/generated/flyvis_temporal_local_replicate_${{ matrix.lr }}.csv
