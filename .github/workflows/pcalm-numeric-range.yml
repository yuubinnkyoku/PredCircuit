name: PC-ALM numeric range

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_pcalm_numeric_range_probe.py"
      - "src/predcircuit/pcalm.py"
      - ".github/workflows/pcalm-numeric-range.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        width: [8, 64]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Probe depth-32 reference configuration
        run: uv run python scripts/run_pcalm_numeric_range_probe.py --depth 32 --width ${{ matrix.width }} --budget 128 --seed 940 --out results/generated/pcalm_numeric_range_d32_w${{ matrix.width }}_s940.json
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-numeric-range-d32-w${{ matrix.width }}-s940
          path: results/generated/pcalm_numeric_range_d32_w${{ matrix.width }}_s940.json
