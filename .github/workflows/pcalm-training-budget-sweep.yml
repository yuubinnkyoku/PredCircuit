name: PC-ALM training budget sweep

on:
  push:
    branches: [main]
    paths:
      - "scripts/sweep_pcalm_training_budget.py"
      - ".github/workflows/pcalm-training-budget-sweep.yml"
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        seed: [970, 971, 972]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync --extra malecns
      - name: Run budget sweep
        run: >-
          uv run python scripts/sweep_pcalm_training_budget.py
          --seed ${{ matrix.seed }}
          --budgets 8 16 32 56 112
          --out results/pcalm-training-budget-seed-${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-training-budget-seed-${{ matrix.seed }}
          path: results/pcalm-training-budget-seed-${{ matrix.seed }}.csv
