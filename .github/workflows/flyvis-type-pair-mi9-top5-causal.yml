name: FlyVis type-pair Mi9 top-five causal holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-mi9-top5-causal-940-959"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [940, 941, 942, 943, 944, 945, 946, 947, 948, 949, 950, 951, 952, 953, 954, 955, 956, 957, 958, 959]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run Mi9 top-five causal diagnostic for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_mi9_top5_causal.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_mi9_top5_causal_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-mi9-top5-causal-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_mi9_top5_causal_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-mi9-top5-causal-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate Mi9 top-five causal holdout
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 1200:
              raise RuntimeError(f"expected 1200 rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite Mi9 top-five causal run detected")
          if set(frame["mi9_group_count"].unique()) != {19}:
              raise RuntimeError("unexpected Mi9 group count")
          if set(frame["top5_group_count"].unique()) != {5}:
              raise RuntimeError("unexpected top-five group count")
          if set(frame["rest_group_count"].unique()) != {14}:
              raise RuntimeError("unexpected remaining Mi9 group count")
          if frame["mean_weight_norm_error"].max() > 2e-6:
              raise RuntimeError("weight-norm matching error too large")
          if frame["mean_bias_error"].max() > 1e-8:
              raise RuntimeError("bias matching error too large")
          frame.to_csv(
              "results/generated/flyvis_type_pair_mi9_top5_causal.csv",
              index=False,
          )

          seed_means = frame.groupby(["seed", "horizon", "rule"], as_index=False)[
              ["cross_entropy", "accuracy", "hard_margin"]
          ].mean()
          comparisons = (
              ("type_minus_local", "type", "local"),
              ("mi9_all_minus_local", "mi9_all", "local"),
              ("mi9_top5_minus_local", "mi9_top5", "local"),
              ("mi9_rest_minus_local", "mi9_rest", "local"),
              ("type_minus_mi9_all", "type", "mi9_all"),
              ("type_minus_mi9_top5", "type", "mi9_top5"),
              ("mi9_all_minus_top5", "mi9_all", "mi9_top5"),
              ("mi9_all_minus_rest", "mi9_all", "mi9_rest"),
              ("mi9_top5_minus_rest", "mi9_top5", "mi9_rest"),
          )
          rows = []
          for horizon in sorted(seed_means["horizon"].unique()):
              subset = seed_means[seed_means.horizon == horizon]
              indexed = {
                  rule: subset[subset.rule == rule].set_index("seed").sort_index()
                  for rule in seed_means["rule"].unique()
              }
              for comparison, treatment_name, baseline_name in comparisons:
                  treatment = indexed[treatment_name]
                  baseline = indexed[baseline_name].loc[treatment.index]
                  for metric in ("cross_entropy", "accuracy", "hard_margin"):
                      if metric == "cross_entropy":
                          delta = (baseline[metric] - treatment[metric]).to_numpy(float)
                      else:
                          delta = (treatment[metric] - baseline[metric]).to_numpy(float)
                      mean = float(delta.mean())
                      std = float(delta.std(ddof=1))
                      ci_low, ci_high = stats.t.interval(
                          0.95,
                          len(delta) - 1,
                          loc=mean,
                          scale=std / np.sqrt(len(delta)),
                      )
                      rows.append(
                          {
                              "horizon": int(horizon),
                              "comparison": comparison,
                              "metric": metric,
                              "n": len(delta),
                              "mean_improvement": mean,
                              "ci_low": float(ci_low),
                              "ci_high": float(ci_high),
                              "positive": int((delta > 0).sum()),
                              "t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                              "wilcoxon_p": float(stats.wilcoxon(delta).pvalue),
                              "cohen_dz": mean / std if std > 0 else float("nan"),
                          }
                      )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_mi9_top5_causal_summary.csv",
              index=False,
          )

          diagnostics = frame.groupby(["seed", "horizon", "rule"], as_index=False)[
              [
                  "mean_relative_direction_change",
                  "mean_weight_norm_error",
                  "mean_bias_error",
              ]
          ].mean()
          diagnostics.to_csv(
              "results/generated/flyvis_type_pair_mi9_top5_causal_diagnostics.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-mi9-top5-causal-aggregate
          path: |
            results/generated/flyvis_type_pair_mi9_top5_causal.csv
            results/generated/flyvis_type_pair_mi9_top5_causal_summary.csv
            results/generated/flyvis_type_pair_mi9_top5_causal_diagnostics.csv
