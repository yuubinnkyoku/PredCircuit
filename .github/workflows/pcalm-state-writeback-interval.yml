name: PC-ALM state writeback interval diagnostic

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_pcalm_state_writeback_interval.py"
      - ".github/workflows/pcalm-state-writeback-interval.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Sweep state writeback interval
        run: |
          python scripts/diagnose_pcalm_state_writeback_interval.py \
            --seed 860 --budget 128 --state-lr 0.25 --dual-leak 0.02 \
            --intervals 1 2 4 8 16 32 64 128 \
            --out results/pcalm_seed860_state_writeback_interval.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-seed860-state-writeback-interval
          path: results/pcalm_seed860_state_writeback_interval.csv
