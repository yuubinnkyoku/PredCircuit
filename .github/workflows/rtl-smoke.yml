name: RTL smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rtl/**
      - .github/workflows/rtl-smoke.yml
  pull_request:
    paths:
      - rtl/**
      - .github/workflows/rtl-smoke.yml

jobs:
  simulate-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Run fixed-point dual-update simulation
        run: |
          mkdir -p build/rtl
          iverilog -g2012 -Wall \
            -s tb_pcalm_dual_update \
            -o build/rtl/tb_pcalm_dual_update \
            rtl/pcalm_dual_update.sv rtl/tb_pcalm_dual_update.sv
          vvp build/rtl/tb_pcalm_dual_update
      - name: Exhaustively verify 12-bit dual arithmetic
        run: |
          iverilog -g2012 -Wall \
            -s tb_pcalm_dual_update_exhaustive \
            -o build/rtl/tb_pcalm_dual_update_exhaustive \
            rtl/pcalm_dual_update.sv rtl/tb_pcalm_dual_update_exhaustive.sv
          timeout 180s vvp build/rtl/tb_pcalm_dual_update_exhaustive
      - name: Generic synthesis comparison
        run: |
          yosys -p 'read_verilog -sv rtl/spc_credit.sv; hierarchy -top spc_credit; proc; opt; check; stat' \
            | tee build/rtl/spc_generic.log
          yosys -p 'read_verilog -sv rtl/pcalm_dual_update.sv; hierarchy -top pcalm_dual_update; proc; opt; check; stat' \
            | tee build/rtl/pcalm_generic.log
      - name: XC7 mapped comparison
        run: |
          yosys -p 'read_verilog -sv rtl/spc_credit.sv; synth_xilinx -family xc7 -top spc_credit; stat' \
            | tee build/rtl/spc_xc7.log
          yosys -p 'read_verilog -sv rtl/pcalm_dual_update.sv; synth_xilinx -family xc7 -top pcalm_dual_update; stat' \
            | tee build/rtl/pcalm_xc7.log
      - name: Fair common-core generic comparison
        run: |
          yosys -p 'read_verilog -sv rtl/credit_core_common.sv; hierarchy -top credit_core_spc; proc; opt; check; stat' \
            | tee build/rtl/common_spc_generic.log
          yosys -p 'read_verilog -sv rtl/credit_core_common.sv; hierarchy -top credit_core_pcalm; proc; opt; check; stat' \
            | tee build/rtl/common_pcalm_generic.log
      - name: Fair common-core XC7 comparison
        run: |
          yosys -p 'read_verilog -sv rtl/credit_core_common.sv; synth_xilinx -family xc7 -top credit_core_spc; stat' \
            | tee build/rtl/common_spc_xc7.log
          yosys -p 'read_verilog -sv rtl/credit_core_common.sv; synth_xilinx -family xc7 -top credit_core_pcalm; stat' \
            | tee build/rtl/common_pcalm_xc7.log
      - uses: actions/upload-artifact@v4
        with:
          name: rtl-synthesis-smoke
          path: build/rtl/*.log
          if-no-files-found: error
