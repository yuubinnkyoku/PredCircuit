name: PC-ALM accumulator width scaling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-accumulator-width.yml
      - scripts/diagnose_pcalm_accumulator_width.py
      - scripts/aggregate_pcalm_accumulator_width.py
      - scripts/diagnose_pcalm_accumulator_precision.py
      - scripts/diagnose_pcalm_mac_operand_precision.py
      - scripts/diagnose_pcalm_update_precision.py
      - scripts/diagnose_pcalm_dual_precision.py
      - src/predcircuit/pcalm.py

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [8, 16, 32]
        seed: [840, 841, 842, 843, 844]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run python scripts/diagnose_pcalm_accumulator_width.py
          --width ${{ matrix.width }}
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_accumulator_width_w${{ matrix.width }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-accumulator-width-w${{ matrix.width }}-seed-${{ matrix.seed }}
          path: results/generated/pcalm_accumulator_width_w${{ matrix.width }}_seed${{ matrix.seed }}.csv
          if-no-files-found: error
  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-accumulator-width-*
          path: artifacts
          merge-multiple: true
      - run: >-
          uv run python scripts/aggregate_pcalm_accumulator_width.py
          --input artifacts
          --out results/generated/pcalm_accumulator_width_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-accumulator-width-aggregate
          path: results/generated/pcalm_accumulator_width_summary.csv
          if-no-files-found: error
