name: FlyVis local gradient trajectory

on:
  push:
    paths:
      - .github/workflows/flyvis-local-gradient-trajectory.yml
      - scripts/diagnose_local_gradient_trajectory.py
      - scripts/run_flyvis_exact_pc_gradient.py
      - scripts/run_flyvis_gradient_alignment.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Track local-gradient alignment
        run: >-
          uv run python scripts/diagnose_local_gradient_trajectory.py
          --extent 1
          --seeds 3
          --epochs 100
          --checkpoints 0,1,5,10,25,50,100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta 0.3
          --learning-rate 0.01
          --train-repeats 4
          --test-repeats 8
          --out results/generated/flyvis_local_gradient_trajectory.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-local-gradient-trajectory
          path: results/generated/flyvis_local_gradient_trajectory.csv
