name: PC-ALM local stopping diagnostic

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [300, 301, 302, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 316, 317, 318, 319]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run diagnostic
        run: >-
          uv run python scripts/diagnose_pcalm_local_stop.py
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_local_stop_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: seed${{ matrix.seed }}
          path: results/generated/pcalm_local_stop_seed${{ matrix.seed }}.csv
