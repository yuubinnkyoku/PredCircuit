name: FlyVis type-pair selective gradient geometry

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-selective-gradient-geometry-2170-2189"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [2170, 2171, 2172, 2173, 2174, 2175, 2176, 2177, 2178, 2179, 2180, 2181, 2182, 2183, 2184, 2185, 2186, 2187, 2188, 2189]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run selective gradient geometry for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_selective_gradient_geometry.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_selective_gradient_geometry_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-selective-gradient-geometry-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_selective_gradient_geometry_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-selective-gradient-geometry-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate selective gradient geometry
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 120:
              raise RuntimeError(f"expected 120 rows, got {len(frame)}")
          if frame["seed"].nunique() != 20:
              raise RuntimeError("expected 20 unique seeds")
          if not frame["finite"].all():
              raise RuntimeError("non-finite selective gradient geometry result detected")
          if frame["l2_match_relative_error"].max() > 1e-5:
              raise RuntimeError("global L2 match relative error exceeded 1e-5")
          frame.to_csv(
              "results/generated/flyvis_type_pair_selective_gradient_geometry.csv",
              index=False,
          )

          metrics = [
              "candidate_edge_fraction",
              "candidate_group_fraction",
              "redistribution_l2",
              "ce_grad_dot_redistribution",
              "hard_grad_dot_redistribution",
              "soft_grad_dot_redistribution",
              "ce_grad_dot_soft_removed",
              "hard_grad_dot_soft_removed",
              "soft_grad_dot_soft_removed",
              "ce_grad_dot_global_removed",
              "hard_grad_dot_global_removed",
              "soft_grad_dot_global_removed",
              "candidate_ce_grad_cos_standard",
              "candidate_hard_grad_cos_standard",
              "candidate_soft_grad_cos_standard",
              "noncandidate_ce_grad_cos_standard",
              "noncandidate_hard_grad_cos_standard",
              "noncandidate_soft_grad_cos_standard",
              "soft_minus_global_next_ce",
              "soft_minus_global_next_hard",
              "soft_minus_global_next_soft",
          ]
          rows = []
          for (scale, horizon), subset in frame.groupby(["init_scale", "horizon"]):
              for metric in metrics:
                  values = subset[metric].to_numpy(float)
                  mean = float(values.mean())
                  std = float(values.std(ddof=1))
                  if std > 0.0:
                      ci_low, ci_high = stats.t.interval(
                          0.95,
                          len(values) - 1,
                          loc=mean,
                          scale=std / np.sqrt(len(values)),
                      )
                      p = float(stats.ttest_1samp(values, 0.0).pvalue)
                      try:
                          w_p = float(stats.wilcoxon(values).pvalue)
                      except ValueError:
                          w_p = float("nan")
                      dz = mean / std
                  else:
                      ci_low = ci_high = mean
                      p = 1.0 if mean == 0.0 else 0.0
                      w_p = p
                      dz = float("nan")
                  rows.append(
                      {
                          "init_scale": float(scale),
                          "horizon": int(horizon),
                          "metric": metric,
                          "n": len(values),
                          "mean": mean,
                          "ci_low": float(ci_low),
                          "ci_high": float(ci_high),
                          "positive": int((values > 0.0).sum()),
                          "negative": int((values < 0.0).sum()),
                          "t_p": p,
                          "wilcoxon_p": w_p,
                          "cohen_dz": dz,
                      }
                  )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_selective_gradient_geometry_summary.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-selective-gradient-geometry-aggregate
          path: |
            results/generated/flyvis_type_pair_selective_gradient_geometry.csv
            results/generated/flyvis_type_pair_selective_gradient_geometry_summary.csv
