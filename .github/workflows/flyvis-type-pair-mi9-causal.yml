name: FlyVis type-pair Mi9 causal holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-mi9-causal-920-939"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [920, 921, 922, 923, 924, 925, 926, 927, 928, 929, 930, 931, 932, 933, 934, 935, 936, 937, 938, 939]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run Mi9 causal diagnostic for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_mi9_causal.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_mi9_causal_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-mi9-causal-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_mi9_causal_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-mi9-causal-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate Mi9 causal holdout
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 960:
              raise RuntimeError(f"expected 960 rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite Mi9 causal run detected")
          frame.to_csv("results/generated/flyvis_type_pair_mi9_causal.csv", index=False)

          seed_means = frame.groupby(["seed", "horizon", "rule"], as_index=False)[
              ["cross_entropy", "accuracy", "hard_margin"]
          ].mean()
          comparisons = (
              ("type_minus_local", "type", "local"),
              ("mi9_only_minus_local", "mi9_only", "local"),
              ("non_mi9_minus_local", "non_mi9", "local"),
              ("type_minus_mi9_only", "type", "mi9_only"),
              ("type_minus_non_mi9", "type", "non_mi9"),
              ("mi9_only_minus_non_mi9", "mi9_only", "non_mi9"),
          )
          rows = []
          for horizon in sorted(seed_means["horizon"].unique()):
              subset = seed_means[seed_means.horizon == horizon]
              indexed = {
                  rule: subset[subset.rule == rule].set_index("seed").sort_index()
                  for rule in seed_means["rule"].unique()
              }
              for comparison, treatment_name, baseline_name in comparisons:
                  treatment = indexed[treatment_name]
                  baseline = indexed[baseline_name].loc[treatment.index]
                  for metric in ("cross_entropy", "accuracy", "hard_margin"):
                      if metric == "cross_entropy":
                          delta = (baseline[metric] - treatment[metric]).to_numpy(float)
                      else:
                          delta = (treatment[metric] - baseline[metric]).to_numpy(float)
                      mean = float(delta.mean())
                      std = float(delta.std(ddof=1))
                      ci_low, ci_high = stats.t.interval(
                          0.95,
                          len(delta) - 1,
                          loc=mean,
                          scale=std / np.sqrt(len(delta)),
                      )
                      rows.append(
                          {
                              "horizon": int(horizon),
                              "comparison": comparison,
                              "metric": metric,
                              "n": len(delta),
                              "mean_improvement": mean,
                              "ci_low": float(ci_low),
                              "ci_high": float(ci_high),
                              "positive": int((delta > 0).sum()),
                              "t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                              "wilcoxon_p": float(stats.wilcoxon(delta).pvalue),
                              "cohen_dz": mean / std if std > 0 else float("nan"),
                          }
                      )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_mi9_causal_summary.csv",
              index=False,
          )

          diagnostics = frame.groupby(["seed", "horizon", "rule"], as_index=False)[
              [
                  "mean_relative_direction_change",
                  "mean_weight_norm_error",
                  "mean_bias_error",
              ]
          ].mean()
          diagnostics.to_csv(
              "results/generated/flyvis_type_pair_mi9_causal_diagnostics.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-mi9-causal-aggregate
          path: |
            results/generated/flyvis_type_pair_mi9_causal.csv
            results/generated/flyvis_type_pair_mi9_causal_summary.csv
            results/generated/flyvis_type_pair_mi9_causal_diagnostics.csv
