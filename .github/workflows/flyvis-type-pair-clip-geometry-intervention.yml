name: FlyVis type-pair clip geometry intervention

on:
  push:
    paths:
      - ".github/workflows/flyvis-type-pair-clip-geometry-intervention.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1910, 1911, 1912, 1913, 1914, 1915, 1916, 1917, 1918, 1919, 1920, 1921, 1922, 1923, 1924, 1925, 1926, 1927, 1928, 1929]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run clip-geometry intervention for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_clip_geometry_intervention.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_clip_geometry_intervention_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-clip-geometry-intervention-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_clip_geometry_intervention_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-clip-geometry-intervention-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate clip-geometry intervention
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 240:
              raise RuntimeError(f"expected 240 rows, got {len(frame)}")
          if frame["seed"].nunique() != 20:
              raise RuntimeError("expected 20 unique seeds")
          if not frame["finite"].all():
              raise RuntimeError("non-finite clip-geometry result detected")
          frame.to_csv(
              "results/generated/flyvis_type_pair_clip_geometry_intervention.csv",
              index=False,
          )

          metrics = ("cross_entropy", "hard_margin", "soft_margin", "weight_norm")
          pivot = frame.pivot(
              index=["seed", "init_scale"], columns="rule", values=list(metrics)
          )
          pivot.columns = [f"{metric}_{rule}" for metric, rule in pivot.columns]
          pivot = pivot.reset_index()

          contrasts = (
              ("group_minus_clip", "standard_group_rescale", "standard_clip"),
              ("global_minus_clip", "standard_global_rescale", "standard_clip"),
              ("group_minus_local", "standard_group_rescale", "local"),
              ("clip_minus_local", "standard_clip", "local"),
          )
          rows = []
          for scale, subset in pivot.groupby("init_scale"):
              for name, left, right in contrasts:
                  for metric in metrics:
                      values = (
                          subset[f"{metric}_{left}"] - subset[f"{metric}_{right}"]
                      ).to_numpy(float)
                      mean = float(values.mean())
                      std = float(values.std(ddof=1))
                      if std > 0.0:
                          ci_low, ci_high = stats.t.interval(
                              0.95,
                              len(values) - 1,
                              loc=mean,
                              scale=std / np.sqrt(len(values)),
                          )
                          p = float(stats.ttest_1samp(values, 0.0).pvalue)
                          try:
                              w_p = float(stats.wilcoxon(values).pvalue)
                          except ValueError:
                              w_p = float("nan")
                          dz = mean / std
                      else:
                          ci_low = ci_high = mean
                          p = 1.0 if mean == 0.0 else 0.0
                          w_p = p
                          dz = float("nan")
                      rows.append(
                          {
                              "init_scale": float(scale),
                              "contrast": name,
                              "metric": metric,
                              "n": len(values),
                              "mean": mean,
                              "ci_low": float(ci_low),
                              "ci_high": float(ci_high),
                              "positive": int((values > 0.0).sum()),
                              "negative": int((values < 0.0).sum()),
                              "t_p": p,
                              "wilcoxon_p": w_p,
                              "cohen_dz": dz,
                          }
                      )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_clip_geometry_intervention_summary.csv",
              index=False,
          )

          geometry_columns = [
              column for column in frame.columns if column.startswith("branch_")
          ]
          frame[["seed", "init_scale", *geometry_columns]].drop_duplicates().to_csv(
              "results/generated/flyvis_type_pair_clip_geometry_intervention_geometry.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-clip-geometry-intervention-aggregate
          path: |
            results/generated/flyvis_type_pair_clip_geometry_intervention.csv
            results/generated/flyvis_type_pair_clip_geometry_intervention_summary.csv
            results/generated/flyvis_type_pair_clip_geometry_intervention_geometry.csv
