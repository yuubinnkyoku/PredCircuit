name: PC-ALM rounding dynamics trace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-width64-rounding-dynamics.yml

jobs:
  trace:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [849, 858]
        role: [nearest, gradient, residual, both]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Trace state and dual dynamics
        shell: bash
        run: |
          rounding_seed=$((4000000 + ${{ matrix.seed }} * 100))
          uv run python scripts/diagnose_pcalm_width64_rounding_dynamics.py \
            --seed ${{ matrix.seed }} \
            --role ${{ matrix.role }} \
            --rounding-seed "$rounding_seed" \
            --out results/generated/pcalm_width64_rounding_dynamics_${{ matrix.role }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-rounding-dynamics-${{ matrix.role }}-seed-${{ matrix.seed }}
          path: results/generated/pcalm_width64_rounding_dynamics_${{ matrix.role }}_seed${{ matrix.seed }}.csv
          if-no-files-found: error
