name: PC-ALM layerwise credit propagation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pcalm-layerwise-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        seed: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync --extra malecns
      - name: Run hold-out layerwise credit probe
        run: |
          uv run python scripts/run_pcalm_layerwise_probe.py \
            --depths 16,32 \
            --budgets 8,16,32,64,128 \
            --width 8 \
            --activation relu \
            --state-lr 0.25 \
            --rho 1.0 \
            --alpha 1.0 \
            --inner-steps 1 \
            --seed ${{ matrix.seed }} \
            --out results/generated/pcalm_layerwise_probe_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-layerwise-probe-seed-${{ matrix.seed }}
          path: results/generated/pcalm_layerwise_probe_seed${{ matrix.seed }}.csv
          if-no-files-found: error

  aggregate:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync --extra malecns
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-layerwise-probe-seed-*
          path: artifacts
          merge-multiple: true
      - name: Aggregate paired layerwise results
        run: |
          uv run python scripts/aggregate_pcalm_layerwise_probe.py \
            --input artifacts \
            --expected-seeds 10 \
            --out-dir results/generated
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-layerwise-probe-aggregate
          path: |
            results/generated/pcalm_layerwise_all.csv
            results/generated/pcalm_layerwise_paired.csv
            results/generated/pcalm_layerwise_fronts.csv
            results/generated/pcalm_layerwise_first_layer_thresholds.csv
          if-no-files-found: error
