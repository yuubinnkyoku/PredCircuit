name: PC-ALM dyadic coefficient holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-dyadic-coefficients.yml
      - scripts/diagnose_pcalm_dyadic_coefficients.py
      - scripts/aggregate_pcalm_dyadic_coefficients.py
      - scripts/diagnose_pcalm_matched_credit_budget.py
      - src/predcircuit/pcalm.py

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [920,921,922,923,924,925,926,927,928,929,930,931,932,933,934,935,936,937,938,939]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run python scripts/diagnose_pcalm_dyadic_coefficients.py
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_dyadic_coefficients_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-dyadic-coefficients-seed-${{ matrix.seed }}
          path: results/generated/pcalm_dyadic_coefficients_seed${{ matrix.seed }}.csv
          if-no-files-found: error
  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: pcalm-dyadic-coefficients-seed-*
          path: artifacts
          merge-multiple: true
      - run: >-
          uv run python scripts/aggregate_pcalm_dyadic_coefficients.py
          --input artifacts
          --out results/generated/pcalm_dyadic_coefficients_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-dyadic-coefficients-aggregate
          path: results/generated/pcalm_dyadic_coefficients_summary.csv
          if-no-files-found: error
