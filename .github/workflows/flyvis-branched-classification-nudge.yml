name: FlyVis branched classification nudge

# Screening sweep for the per-frame branched local credit rule.
on:
  push:
    paths:
      - .github/workflows/flyvis-branched-classification-nudge.yml
      - scripts/run_flyvis_branched_classification_nudge.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/run_flyvis_temporal_classification_nudge.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - scripts/run_flyvis_temporal_coherence_gate.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nudge_steps: 1
            learning_rate: 150
          - nudge_steps: 2
            learning_rate: 80
          - nudge_steps: 4
            learning_rate: 40
          - nudge_steps: 8
            learning_rate: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train with branched classification credit
        run: >-
          uv run python scripts/run_flyvis_branched_classification_nudge.py
          --extent 2
          --seeds 5
          --epochs 100
          --frames 7
          --frame-steps 2
          --nudge-steps ${{ matrix.nudge_steps }}
          --step-size 0.015
          --beta 0.03
          --learning-rate ${{ matrix.learning_rate }}
          --weight-decay 1e-5
          --max-update 0.05
          --test-repeats 8
          --out results/generated/flyvis_branched_classification_nudge_steps_${{ matrix.nudge_steps }}_lr_${{ matrix.learning_rate }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branched-classification-nudge-steps-${{ matrix.nudge_steps }}-lr-${{ matrix.learning_rate }}
          path: results/generated/flyvis_branched_classification_nudge_steps_${{ matrix.nudge_steps }}_lr_${{ matrix.learning_rate }}.csv
