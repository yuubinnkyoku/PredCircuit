name: FlyVis type-pair fraction filter

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_flyvis_type_pair_fraction_filter.py"
      - ".github/workflows/flyvis-type-pair-fraction-filter.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        seed: [10, 11, 12, 13, 14]
        condition:
          - local
          - frac25a
          - frac25b
          - frac50a
          - frac50b
          - frac75a
          - frac75b
          - all
        include:
          - condition: local
            fraction: 0.0
            salt: A
          - condition: frac25a
            fraction: 0.25
            salt: A
          - condition: frac25b
            fraction: 0.25
            salt: B
          - condition: frac50a
            fraction: 0.5
            salt: A
          - condition: frac50b
            fraction: 0.5
            salt: B
          - condition: frac75a
            fraction: 0.75
            salt: A
          - condition: frac75b
            fraction: 0.75
            salt: B
          - condition: all
            fraction: 1.0
            salt: A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Validate ${{ matrix.condition }} on seed ${{ matrix.seed }}
        run: >-
          uv run python scripts/run_flyvis_type_pair_fraction_filter.py
          --seed ${{ matrix.seed }}
          --fraction ${{ matrix.fraction }}
          --salt ${{ matrix.salt }}
          --start-epoch 50
          --out results/generated/flyvis_fraction_${{ matrix.condition }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-fraction-${{ matrix.condition }}-seed${{ matrix.seed }}
          path: results/generated/flyvis_fraction_${{ matrix.condition }}_seed${{ matrix.seed }}.csv
