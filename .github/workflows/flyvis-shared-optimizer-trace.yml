name: FlyVis shared optimizer geometry

on:
  push:
    paths:
      - "scripts/trace_flyvis_shared_parameter_optimizer.py"
      - ".github/workflows/flyvis-shared-optimizer-trace.yml"
  workflow_dispatch:

jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        mode: [local, exact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Trace shared ${{ matrix.mode }} optimizer geometry
        run: >-
          uv run python scripts/trace_flyvis_shared_parameter_optimizer.py
          --mode ${{ matrix.mode }}
          --seeds 5
          --epochs 100
          --checkpoint-every 10
          --nudge-steps 8
          --learning-rate 0.01
          --test-repeats 8
          --out results/generated/flyvis_shared_optimizer_${{ matrix.mode }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-shared-optimizer-${{ matrix.mode }}
          path: results/generated/flyvis_shared_optimizer_${{ matrix.mode }}.csv
