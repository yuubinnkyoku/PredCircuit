name: FlyVis online local gradient scaling

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/flyvis-online-gradient-scaling.yml
      - scripts/diagnose_online_local_gradient_scaling.py
      - scripts/diagnose_local_gradient_trajectory.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - scripts/run_flyvis_retinotopic_temporal_contrastive.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
      - pyproject.toml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extent: 1
            optimizer: sgd
            learning_rate: 10.0
          - extent: 2
            optimizer: sgd
            learning_rate: 10.0
          - extent: 1
            optimizer: adam
            learning_rate: 0.001
          - extent: 2
            optimizer: adam
            learning_rate: 0.001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Track raw and effective local-gradient alignment
        run: >-
          uv run python scripts/diagnose_online_local_gradient_scaling.py
          --extent ${{ matrix.extent }}
          --optimizer ${{ matrix.optimizer }}
          --learning-rate ${{ matrix.learning_rate }}
          --seeds 3
          --epochs 100
          --checkpoints 0,1,5,10,25,50,100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta 0.3
          --test-repeats 4
          --out results/generated/flyvis_online_gradient_scaling_e${{ matrix.extent }}_${{ matrix.optimizer }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-online-gradient-scaling-e${{ matrix.extent }}-${{ matrix.optimizer }}
          path: results/generated/flyvis_online_gradient_scaling_e${{ matrix.extent }}_${{ matrix.optimizer }}.csv
