name: FlyVis type-pair coefficient grid holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-coefficient-grid-1690-1709"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed:
          - 1690
          - 1691
          - 1692
          - 1693
          - 1694
          - 1695
          - 1696
          - 1697
          - 1698
          - 1699
          - 1700
          - 1701
          - 1702
          - 1703
          - 1704
          - 1705
          - 1706
          - 1707
          - 1708
          - 1709
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run coefficient grid for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_coefficient_grid.py \
            --seed ${{ matrix.seed }} \
            --init-scales 0.12,0.14,0.16 \
            --coefficients 1.0,1.5,2.0,2.5,3.0,3.5,4.0 \
            --horizons 160,200 \
            --eval-jitter-base 10920000 \
            --out results/generated/flyvis_type_pair_coefficient_grid_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-coefficient-grid-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_coefficient_grid_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-coefficient-grid-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate coefficient grid
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path

          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 3360:
              raise RuntimeError(f"expected 3360 rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite coefficient-grid result detected")
          if frame["seed"].nunique() != 20:
              raise RuntimeError("expected 20 unique seeds")

          frame.to_csv(
              "results/generated/flyvis_type_pair_coefficient_grid.csv",
              index=False,
          )

          metrics = (
              "cross_entropy",
              "accuracy",
              "hard_margin",
              "soft_margin",
              "weight_norm",
          )
          per_seed = frame.groupby(
              ["seed", "init_scale", "shared_coefficient", "horizon"],
              as_index=False,
          )[list(metrics)].mean()
          rows = []
          coefficients = sorted(per_seed["shared_coefficient"].unique())
          for scale in sorted(per_seed["init_scale"].unique()):
              for horizon in sorted(per_seed["horizon"].unique()):
                  subset = per_seed[
                      (per_seed["init_scale"] == scale)
                      & (per_seed["horizon"] == horizon)
                  ]
                  local = subset[subset["shared_coefficient"] == 1.0].set_index("seed").sort_index()
                  if len(local) != 20:
                      raise RuntimeError("missing coefficient=1 local baseline")
                  for coefficient in coefficients:
                      lhs = subset[subset["shared_coefficient"] == coefficient].set_index("seed").sort_index()
                      if not lhs.index.equals(local.index) or len(lhs) != 20:
                          raise RuntimeError("paired seed mismatch")
                      for metric in metrics:
                          diff = lhs[metric].to_numpy(float) - local[metric].to_numpy(float)
                          mean = float(diff.mean())
                          std = float(diff.std(ddof=1))
                          se = std / np.sqrt(len(diff))
                          if std > 0.0:
                              ci_low, ci_high = stats.t.interval(
                                  0.95,
                                  len(diff) - 1,
                                  loc=mean,
                                  scale=se,
                              )
                              p_value = float(
                                  stats.ttest_rel(
                                      lhs[metric].to_numpy(float),
                                      local[metric].to_numpy(float),
                                  ).pvalue
                              )
                              dz = mean / std
                          else:
                              ci_low = ci_high = mean
                              p_value = 1.0
                              dz = 0.0
                          rows.append(
                              {
                                  "init_scale": float(scale),
                                  "horizon": int(horizon),
                                  "shared_coefficient": float(coefficient),
                                  "metric": metric,
                                  "n": len(diff),
                                  "mean_difference_vs_local": mean,
                                  "ci_low": float(ci_low),
                                  "ci_high": float(ci_high),
                                  "p_value": p_value,
                                  "cohen_dz": float(dz),
                                  "positive_seeds": int((diff > 0).sum()),
                                  "negative_seeds": int((diff < 0).sum()),
                              }
                          )

          paired = pd.DataFrame(rows)
          paired.to_csv(
              "results/generated/flyvis_type_pair_coefficient_grid_paired.csv",
              index=False,
          )

          summary = (
              per_seed.groupby(
                  ["init_scale", "horizon", "shared_coefficient"],
                  as_index=False,
              )[list(metrics)]
              .mean()
          )
          summary.to_csv(
              "results/generated/flyvis_type_pair_coefficient_grid_summary.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-coefficient-grid-aggregate
          path: |
            results/generated/flyvis_type_pair_coefficient_grid.csv
            results/generated/flyvis_type_pair_coefficient_grid_paired.csv
            results/generated/flyvis_type_pair_coefficient_grid_summary.csv
