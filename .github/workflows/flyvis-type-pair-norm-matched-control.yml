name: FlyVis type-pair norm-matched control

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_flyvis_type_pair_norm_matched_control.py"
      - ".github/workflows/flyvis-type-pair-norm-matched-control.yml"

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [60, 61, 62, 63, 64, 65, 66, 67, 68, 69]
        rule: [local, type_pair_norm_matched, shuffled_norm_matched]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync
      - name: Train norm-matched control
        run: |
          SHUFFLE_SEED=$((10000 + ${{ matrix.seed }}))
          uv run python scripts/run_flyvis_type_pair_norm_matched_control.py \
            --seed ${{ matrix.seed }} \
            --rule ${{ matrix.rule }} \
            --shuffle-seed "$SHUFFLE_SEED" \
            --epochs 100 \
            --learning-rate 160 \
            --out results/generated/norm_matched_${{ matrix.rule }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: norm-matched-${{ matrix.rule }}-seed${{ matrix.seed }}
          path: results/generated/norm_matched_${{ matrix.rule }}_seed${{ matrix.seed }}.csv

  aggregate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: norm-matched-*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate norm-matched control
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import math
          import pandas as pd
          import scipy.stats as stats

          frame = pd.concat(
              [pd.read_csv(path) for path in sorted(Path("artifacts").glob("*.csv"))],
              ignore_index=True,
          )
          if len(frame) != 30:
              raise RuntimeError(f"expected 30 rows, got {len(frame)}")
          if not bool(frame["finite"].all()):
              raise RuntimeError("non-finite norm-matched result")

          indexed = {
              rule: frame[frame.rule == rule].set_index("seed").sort_index()
              for rule in (
                  "local",
                  "type_pair_norm_matched",
                  "shuffled_norm_matched",
              )
          }
          if not (
              indexed["local"].index.equals(indexed["type_pair_norm_matched"].index)
              and indexed["local"].index.equals(indexed["shuffled_norm_matched"].index)
          ):
              raise RuntimeError("paired seed mismatch")

          rows = []
          comparisons = (
              ("type_pair_norm_matched", "local"),
              ("shuffled_norm_matched", "local"),
              ("type_pair_norm_matched", "shuffled_norm_matched"),
          )
          for first, second in comparisons:
              for metric, higher_is_better in (
                  ("cross_entropy_after", False),
                  ("accuracy_after", True),
                  ("margin_after", True),
              ):
                  raw_delta = indexed[first][metric] - indexed[second][metric]
                  delta = raw_delta if higher_is_better else -raw_delta
                  n = len(delta)
                  mean = float(delta.mean())
                  sd = float(delta.std(ddof=1))
                  se = sd / math.sqrt(n)
                  tcrit = float(stats.t.ppf(0.975, n - 1))
                  ttest = stats.ttest_rel(indexed[first][metric], indexed[second][metric])
                  try:
                      wilcoxon_p = float(stats.wilcoxon(delta).pvalue)
                  except ValueError:
                      wilcoxon_p = float("nan")
                  rows.append({
                      "first": first,
                      "second": second,
                      "metric": metric,
                      "n": n,
                      "mean_gain_first_vs_second": mean,
                      "median_gain_first_vs_second": float(delta.median()),
                      "sd_gain": sd,
                      "ci95_low": mean - tcrit * se,
                      "ci95_high": mean + tcrit * se,
                      "first_better_seeds": int((delta > 0).sum()),
                      "paired_t_p_two_sided": float(ttest.pvalue),
                      "wilcoxon_p_two_sided": wilcoxon_p,
                      "cohen_dz": mean / sd if sd > 0 else float("nan"),
                  })
          summary = pd.DataFrame(rows)
          geometry = (
              frame.groupby("rule")[[
                  "mean_relative_edge_direction_change",
                  "mean_edge_norm_ratio",
                  "mean_edge_clip_fraction",
                  "weight_norm",
                  "bias_norm",
              ]]
              .mean()
              .reset_index()
          )
          frame.to_csv("results/generated/flyvis_type_pair_norm_matched_control.csv", index=False)
          summary.to_csv(
              "results/generated/flyvis_type_pair_norm_matched_control_summary.csv",
              index=False,
          )
          geometry.to_csv(
              "results/generated/flyvis_type_pair_norm_matched_control_geometry.csv",
              index=False,
          )
          print(summary.to_string(index=False))
          print("\nGeometry:")
          print(geometry.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-norm-matched-control-aggregate
          path: |
            results/generated/flyvis_type_pair_norm_matched_control.csv
            results/generated/flyvis_type_pair_norm_matched_control_summary.csv
            results/generated/flyvis_type_pair_norm_matched_control_geometry.csv
