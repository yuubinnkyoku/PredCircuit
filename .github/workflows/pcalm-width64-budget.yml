name: PC-ALM width-64 relaxation budget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-width64-budget.yml
      - scripts/diagnose_pcalm_width64_budget.py
      - scripts/diagnose_pcalm_matched_credit_budget.py
      - src/predcircuit/pcalm.py

jobs:
  seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [840, 841, 842, 843, 844]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run python scripts/diagnose_pcalm_width64_budget.py
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_width64_budget_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-width64-budget-seed-${{ matrix.seed }}
          path: results/generated/pcalm_width64_budget_seed${{ matrix.seed }}.csv
          if-no-files-found: error
