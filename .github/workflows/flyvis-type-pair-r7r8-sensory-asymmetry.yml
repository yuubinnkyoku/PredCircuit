name: FlyVis R7/R8 sensory-asymmetry robustness

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-r7r8-sensory-asymmetry-960-979"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [960, 961, 962, 963, 964, 965, 966, 967, 968, 969, 970, 971, 972, 973, 974, 975, 976, 977, 978, 979]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run sensory-asymmetry diagnostic for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_r7r8_sensory_asymmetry.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-r7r8-sensory-asymmetry-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-r7r8-sensory-asymmetry-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate sensory-asymmetry robustness
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if len(frame) != 1920:
              raise RuntimeError(f"expected 1920 rows, got {len(frame)}")
          if not frame["finite"].all():
              raise RuntimeError("non-finite sensory-asymmetry run detected")
          frame.to_csv(
              "results/generated/flyvis_type_pair_r7r8_sensory_asymmetry.csv",
              index=False,
          )

          seed_means = frame.groupby(
              ["seed", "horizon", "profile", "rule"], as_index=False
          )[["cross_entropy", "accuracy", "hard_margin"]].mean()
          comparisons = (
              ("r7_only_minus_local", "r7_only", "local"),
              ("r8_only_minus_local", "r8_only", "local"),
              ("r7r8_minus_local", "r7r8", "local"),
              ("r8_only_minus_r7_only", "r8_only", "r7_only"),
              ("r7r8_minus_r7_only", "r7r8", "r7_only"),
              ("r7r8_minus_r8_only", "r7r8", "r8_only"),
          )
          rows = []
          per_seed_contrast = []
          for horizon in sorted(seed_means["horizon"].unique()):
              for profile in sorted(seed_means["profile"].unique()):
                  subset = seed_means[
                      (seed_means.horizon == horizon) & (seed_means.profile == profile)
                  ]
                  indexed = {
                      rule: subset[subset.rule == rule].set_index("seed").sort_index()
                      for rule in seed_means["rule"].unique()
                  }
                  for comparison, treatment_name, baseline_name in comparisons:
                      treatment = indexed[treatment_name]
                      baseline = indexed[baseline_name].loc[treatment.index]
                      for metric in ("cross_entropy", "accuracy", "hard_margin"):
                          if metric == "cross_entropy":
                              delta = (baseline[metric] - treatment[metric]).to_numpy(float)
                          else:
                              delta = (treatment[metric] - baseline[metric]).to_numpy(float)
                          mean = float(delta.mean())
                          std = float(delta.std(ddof=1))
                          ci_low, ci_high = stats.t.interval(
                              0.95,
                              len(delta) - 1,
                              loc=mean,
                              scale=std / np.sqrt(len(delta)),
                          )
                          rows.append(
                              {
                                  "horizon": int(horizon),
                                  "profile": profile,
                                  "comparison": comparison,
                                  "metric": metric,
                                  "n": len(delta),
                                  "mean_improvement": mean,
                                  "ci_low": float(ci_low),
                                  "ci_high": float(ci_high),
                                  "positive": int((delta > 0).sum()),
                                  "t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                                  "wilcoxon_p": float(stats.wilcoxon(delta).pvalue),
                                  "cohen_dz": mean / std if std > 0 else float("nan"),
                              }
                          )
                          if comparison == "r8_only_minus_r7_only":
                              per_seed_contrast.extend(
                                  {
                                      "seed": int(seed),
                                      "horizon": int(horizon),
                                      "profile": profile,
                                      "metric": metric,
                                      "r8_minus_r7": float(value),
                                  }
                                  for seed, value in zip(treatment.index, delta, strict=True)
                              )
          pd.DataFrame(rows).to_csv(
              "results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_summary.csv",
              index=False,
          )

          contrasts = pd.DataFrame(per_seed_contrast)
          interaction_rows = []
          for horizon in sorted(contrasts["horizon"].unique()):
              for metric in ("cross_entropy", "accuracy", "hard_margin"):
                  subset = contrasts[
                      (contrasts.horizon == horizon) & (contrasts.metric == metric)
                  ]
                  pivot = subset.pivot(index="seed", columns="profile", values="r8_minus_r7")
                  delta = (pivot["r8_high"] - pivot["r7_high"]).to_numpy(float)
                  mean = float(delta.mean())
                  std = float(delta.std(ddof=1))
                  ci_low, ci_high = stats.t.interval(
                      0.95,
                      len(delta) - 1,
                      loc=mean,
                      scale=std / np.sqrt(len(delta)),
                  )
                  interaction_rows.append(
                      {
                          "horizon": int(horizon),
                          "metric": metric,
                          "n": len(delta),
                          "gain_alignment_interaction": mean,
                          "ci_low": float(ci_low),
                          "ci_high": float(ci_high),
                          "positive": int((delta > 0).sum()),
                          "t_p": float(stats.ttest_1samp(delta, 0.0).pvalue),
                          "wilcoxon_p": float(stats.wilcoxon(delta).pvalue),
                          "cohen_dz": mean / std if std > 0 else float("nan"),
                      }
                  )
          pd.DataFrame(interaction_rows).to_csv(
              "results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_interaction.csv",
              index=False,
          )

          diagnostics = frame.groupby(
              ["seed", "horizon", "profile", "rule"], as_index=False
          )[[
              "mean_relative_direction_change",
              "mean_weight_norm_error",
              "mean_bias_error",
          ]].mean()
          diagnostics.to_csv(
              "results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_diagnostics.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-r7r8-sensory-asymmetry-aggregate
          path: |
            results/generated/flyvis_type_pair_r7r8_sensory_asymmetry.csv
            results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_summary.csv
            results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_interaction.csv
            results/generated/flyvis_type_pair_r7r8_sensory_asymmetry_diagnostics.csv
