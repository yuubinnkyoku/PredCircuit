name: FlyVis retinotopy learning

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/flyvis-retinotopy-learning.yml
      - src/predcircuit/flyvis_retinotopy.py
      - scripts/run_flyvis_retinotopic_learning.py

jobs:
  learning-pilot:
    name: pc-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: batch4-t8-lr003
            batch_size: 4
            target_steps: 8
            weight_lr: 0.003
          - label: batch1-t8-lr003
            batch_size: 1
            target_steps: 8
            weight_lr: 0.003
          - label: batch1-t32-lr003
            batch_size: 1
            target_steps: 32
            weight_lr: 0.003
          - label: batch1-t32-lr01
            batch_size: 1
            target_steps: 32
            weight_lr: 0.01
          - label: batch4-t32-lr01
            batch_size: 4
            target_steps: 32
            weight_lr: 0.01
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Run local-PC learning diagnostic
        run: >-
          uv run python scripts/run_flyvis_retinotopic_learning.py
          --extent 1
          --seeds 3
          --epochs 100
          --frames 7
          --frame-steps 2
          --target-steps ${{ matrix.target_steps }}
          --step-size 0.015
          --weight-lr ${{ matrix.weight_lr }}
          --train-batch-size ${{ matrix.batch_size }}
          --test-repeats 8
          --out results/generated/flyvis_retinotopic_learning_${{ matrix.label }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-retinotopic-learning-${{ matrix.label }}
          path: results/generated/flyvis_retinotopic_learning_${{ matrix.label }}.csv
          if-no-files-found: error
