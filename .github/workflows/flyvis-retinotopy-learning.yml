name: FlyVis retinotopy learning

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/flyvis-retinotopy-learning.yml
      - src/predcircuit/flyvis_retinotopy.py
      - scripts/run_flyvis_retinotopic_learning.py

jobs:
  learning-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        weight_lr: [0.0001, 0.0003, 0.001, 0.003]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Run local-PC learning sweep
        run: >-
          uv run python scripts/run_flyvis_retinotopic_learning.py
          --extent 1
          --seeds 3
          --epochs 80
          --frames 7
          --frame-steps 2
          --target-steps 8
          --step-size 0.015
          --weight-lr ${{ matrix.weight_lr }}
          --test-repeats 4
          --out results/generated/flyvis_retinotopic_learning_${{ matrix.weight_lr }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-retinotopic-learning-${{ matrix.weight_lr }}
          path: results/generated/flyvis_retinotopic_learning_${{ matrix.weight_lr }}.csv
          if-no-files-found: error
