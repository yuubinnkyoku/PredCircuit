name: FlyVis temporal local PC extent-2 beta sweep

on:
  push:
    paths:
      - .github/workflows/flyvis-temporal-extent2-beta-sweep.yml
      - scripts/run_flyvis_retinotopic_temporal_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  beta-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        beta: [0.03, 0.1, 0.3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Train extent-2 temporal local PC at beta ${{ matrix.beta }}
        run: >-
          uv run python scripts/run_flyvis_retinotopic_temporal_contrastive.py
          --extent 2
          --seeds 10
          --epochs 100
          --frames 7
          --frame-steps 2
          --step-size 0.015
          --beta ${{ matrix.beta }}
          --weight-lr 10.0
          --test-repeats 8
          --out results/generated/flyvis_temporal_local_extent2_beta_${{ matrix.beta }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-temporal-local-extent2-beta-${{ matrix.beta }}
          path: results/generated/flyvis_temporal_local_extent2_beta_${{ matrix.beta }}.csv
