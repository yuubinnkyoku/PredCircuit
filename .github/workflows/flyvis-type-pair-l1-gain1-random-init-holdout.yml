name: FlyVis random-init L1 gain-1 holdout

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-l1-gain1-random-init-1140-1159"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1140, 1141, 1142, 1143, 1144, 1145, 1146, 1147, 1148, 1149, 1150, 1151, 1152, 1153, 1154, 1155, 1156, 1157, 1158, 1159]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run random-init gain-1 holdout for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_l1_gain1_random_init_holdout.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_l1_gain1_random_init_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-l1-gain1-random-init-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_l1_gain1_random_init_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-l1-gain1-random-init-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate random-init gain-1 holdout
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if not frame["finite"].all():
              raise RuntimeError("non-finite random-init gain-1 holdout detected")
          frame.to_csv("results/generated/flyvis_type_pair_l1_gain1_random_init.csv", index=False)
          seed_means = frame.groupby(["seed", "horizon", "rule"], as_index=False)[
              ["cross_entropy", "accuracy", "hard_margin", "soft_margin", "correct_probability", "wrong_tail_pressure", "ce_on_local_correct", "ce_on_local_wrong"]
          ].mean()
          metric_signs = {"cross_entropy": -1.0, "accuracy": 1.0, "hard_margin": 1.0, "soft_margin": 1.0, "correct_probability": 1.0, "wrong_tail_pressure": -1.0, "ce_on_local_correct": -1.0, "ce_on_local_wrong": -1.0}
          rows = []
          for horizon in sorted(seed_means["horizon"].unique()):
              subset = seed_means[seed_means.horizon == horizon]
              piv = {rule: subset[subset.rule == rule].set_index("seed").sort_index() for rule in ("local", "gain1", "standard")}
              for comparison, treatment, reference in (("gain1_vs_local", "gain1", "local"), ("standard_vs_local", "standard", "local"), ("gain1_vs_standard", "gain1", "standard")):
                  for metric, sign in metric_signs.items():
                      delta = sign * (piv[treatment][metric] - piv[reference][metric]).to_numpy(float)
                      mean = float(delta.mean())
                      std = float(delta.std(ddof=1))
                      lo, hi = stats.t.interval(0.95, len(delta)-1, loc=mean, scale=std/np.sqrt(len(delta)))
                      rows.append({"horizon": int(horizon), "comparison": comparison, "metric": metric, "n": len(delta), "mean_improvement": mean, "ci_low": float(lo), "ci_high": float(hi), "positive": int((delta > 0).sum()), "t_p": float(stats.ttest_1samp(delta, 0.0).pvalue), "wilcoxon_p": float(stats.wilcoxon(delta).pvalue), "cohen_dz": mean/std if std > 0 else float("nan")})
          pd.DataFrame(rows).to_csv("results/generated/flyvis_type_pair_l1_gain1_random_init_summary.csv", index=False)
          frame.groupby(["seed", "horizon", "rule"], as_index=False)[["mean_weight_norm_error", "mean_bias_error"]].mean().to_csv("results/generated/flyvis_type_pair_l1_gain1_random_init_diagnostics.csv", index=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-l1-gain1-random-init-aggregate
          path: |
            results/generated/flyvis_type_pair_l1_gain1_random_init.csv
            results/generated/flyvis_type_pair_l1_gain1_random_init_summary.csv
            results/generated/flyvis_type_pair_l1_gain1_random_init_diagnostics.csv
