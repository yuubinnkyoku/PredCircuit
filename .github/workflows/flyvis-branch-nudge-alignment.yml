name: FlyVis branched nudge alignment

on:
  push:
    paths:
      - .github/workflows/flyvis-branch-nudge-alignment.yml
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_temporal_classification_nudge.py
      - scripts/run_flyvis_gradient_alignment.py
      - scripts/run_flyvis_temporal_credit_projection.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  branch-nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nudge_steps: [1, 2, 4, 8, 16, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Compare branched and independent local credit
        run: >-
          uv run python scripts/diagnose_flyvis_branch_nudge_alignment.py
          --extent 2
          --seeds 20
          --repeats 1
          --frames 7
          --frame-steps 2
          --nudge-steps ${{ matrix.nudge_steps }}
          --step-size 0.015
          --beta 0.03
          --out results/generated/flyvis_branch_nudge_alignment_steps_${{ matrix.nudge_steps }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branch-nudge-alignment-steps-${{ matrix.nudge_steps }}
          path: results/generated/flyvis_branch_nudge_alignment_steps_${{ matrix.nudge_steps }}.csv
