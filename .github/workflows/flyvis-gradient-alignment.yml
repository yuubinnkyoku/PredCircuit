name: FlyVis local-gradient alignment

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/flyvis-gradient-alignment.yml
      - src/predcircuit/model.py
      - src/predcircuit/flyvis_retinotopy.py
      - scripts/run_flyvis_gradient_alignment.py
      - scripts/run_flyvis_retinotopic_contrastive.py
      - scripts/run_flyvis_retinotopic_temporal_contrastive.py

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Compare local rules with exact same-dynamics gradient
        run: >-
          uv run python scripts/run_flyvis_gradient_alignment.py
          --extent 1
          --seeds 2
          --frames 7
          --frame-steps 2
          --branch-steps 32
          --step-size 0.015
          --beta 0.3
          --out results/generated/flyvis_gradient_alignment.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-gradient-alignment
          path: results/generated/flyvis_gradient_alignment.csv
          if-no-files-found: error
