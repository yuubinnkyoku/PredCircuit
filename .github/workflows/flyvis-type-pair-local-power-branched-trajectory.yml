name: FlyVis local power branched trajectory

on:
  push:
    paths:
      - ".github/triggers/run-type-pair-local-power-branched-trajectory-1460-1479"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1460, 1461, 1462, 1463, 1464, 1465, 1466, 1467, 1468, 1469, 1470, 1471, 1472, 1473, 1474, 1475, 1476, 1477, 1478, 1479]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Run local power branched trajectory for seed ${{ matrix.seed }}
        shell: bash
        run: |
          mkdir -p results/generated
          uv run python scripts/diagnose_flyvis_type_pair_local_power_branched_trajectory.py \
            --seed ${{ matrix.seed }} \
            --out results/generated/flyvis_type_pair_local_power_branched_trajectory_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: type-pair-local-power-branched-trajectory-seed${{ matrix.seed }}
          path: results/generated/flyvis_type_pair_local_power_branched_trajectory_seed${{ matrix.seed }}.csv

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: type-pair-local-power-branched-trajectory-seed*
          path: artifacts
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync
      - name: Aggregate local power branched trajectory
        shell: bash
        run: |
          mkdir -p results/generated
          uv run --with scipy python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from scipy import stats

          paths = sorted(Path("artifacts").glob("*.csv"))
          if len(paths) != 20:
              raise RuntimeError(f"expected 20 seed artifacts, got {len(paths)}")
          frame = pd.concat([pd.read_csv(path) for path in paths], ignore_index=True)
          if not frame["finite"].all():
              raise RuntimeError("non-finite local power trajectory detected")
          frame.to_csv(
              "results/generated/flyvis_type_pair_local_power_branched_trajectory.csv",
              index=False,
          )

          metric_columns = [
              "local_power_minus_threshold_cross_entropy",
              "local_power_minus_threshold_accuracy",
              "local_power_minus_threshold_hard_margin",
              "local_power_minus_threshold_soft_margin",
              "branch_weight_distance",
              "branch_bias_distance",
              "local_power_state_local_power_added_group_fraction",
              "local_power_state_local_power_suppressed_group_fraction",
              "local_power_state_mean_rho",
              "threshold_state_mean_rho",
          ]
          per_seed = frame.groupby(
              ["seed", "init_mode", "branch_step"], as_index=False
          )[metric_columns].mean()
          rows = []
          for (mode, step), subset in per_seed.groupby(["init_mode", "branch_step"]):
              for metric in metric_columns:
                  values = subset[metric].to_numpy(float)
                  mean = float(values.mean())
                  std = float(values.std(ddof=1))
                  if std > 0.0:
                      ci_low, ci_high = stats.t.interval(
                          0.95,
                          len(values) - 1,
                          loc=mean,
                          scale=std / np.sqrt(len(values)),
                      )
                      p = float(stats.ttest_1samp(values, 0.0).pvalue)
                      dz = mean / std
                  else:
                      ci_low = ci_high = mean
                      p = 1.0 if mean == 0.0 else 0.0
                      dz = float("nan")
                  rows.append(
                      {
                          "init_mode": mode,
                          "branch_step": int(step),
                          "metric": metric,
                          "n": len(values),
                          "mean": mean,
                          "ci_low": float(ci_low),
                          "ci_high": float(ci_high),
                          "positive": int((values > 0.0).sum()),
                          "t_p": p,
                          "cohen_dz": dz,
                      }
                  )
          summary = pd.DataFrame(rows)
          summary.to_csv(
              "results/generated/flyvis_type_pair_local_power_branched_trajectory_summary.csv",
              index=False,
          )

          hard = per_seed.pivot_table(
              index=["seed", "init_mode"],
              columns="branch_step",
              values="local_power_minus_threshold_hard_margin",
          )
          amp_rows = []
          if 1 in hard.columns:
              for mode in hard.index.get_level_values("init_mode").unique():
                  subset = hard.xs(mode, level="init_mode")
                  for step in (5, 10, 20):
                      if step not in subset.columns:
                          continue
                      values = (subset[step] - subset[1]).dropna().to_numpy(float)
                      mean = float(values.mean())
                      std = float(values.std(ddof=1))
                      if std > 0.0:
                          ci_low, ci_high = stats.t.interval(
                              0.95,
                              len(values) - 1,
                              loc=mean,
                              scale=std / np.sqrt(len(values)),
                          )
                          p = float(stats.ttest_1samp(values, 0.0).pvalue)
                          dz = mean / std
                      else:
                          ci_low = ci_high = mean
                          p = 1.0 if mean == 0.0 else 0.0
                          dz = float("nan")
                      amp_rows.append(
                          {
                              "init_mode": mode,
                              "from_step": 1,
                              "to_step": step,
                              "n": len(values),
                              "hard_margin_amplification": mean,
                              "ci_low": float(ci_low),
                              "ci_high": float(ci_high),
                              "positive": int((values > 0.0).sum()),
                              "t_p": p,
                              "cohen_dz": dz,
                          }
                      )
          pd.DataFrame(amp_rows).to_csv(
              "results/generated/flyvis_type_pair_local_power_branched_trajectory_amplification.csv",
              index=False,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-type-pair-local-power-branched-trajectory-aggregate
          path: |
            results/generated/flyvis_type_pair_local_power_branched_trajectory.csv
            results/generated/flyvis_type_pair_local_power_branched_trajectory_summary.csv
            results/generated/flyvis_type_pair_local_power_branched_trajectory_amplification.csv
