name: FlyVis residual type pairs

on:
  push:
    paths:
      - .github/workflows/flyvis-residual-type-pairs.yml
      - scripts/diagnose_flyvis_residual_type_pairs.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nudge_steps: [8, 16, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Diagnose residual type pairs at nudge ${{ matrix.nudge_steps }}
        run: >-
          uv run python scripts/diagnose_flyvis_residual_type_pairs.py
          --seeds 3
          --epochs 100
          --checkpoint-every 20
          --frames 7
          --frame-steps 2
          --nudge-steps ${{ matrix.nudge_steps }}
          --step-size 0.015
          --beta 0.03
          --learning-rate 0.01
          --beta1 0.9
          --beta2 0.999
          --adam-epsilon 1e-8
          --test-repeats 4
          --out results/generated/flyvis_residual_type_pairs_${{ matrix.nudge_steps }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-residual-type-pairs-${{ matrix.nudge_steps }}
          path: results/generated/flyvis_residual_type_pairs_${{ matrix.nudge_steps }}.csv
