name: FlyVis branched training trajectory

on:
  push:
    paths:
      - .github/workflows/flyvis-branched-training-trajectory.yml
      - scripts/diagnose_flyvis_branched_training_trajectory.py
      - scripts/diagnose_flyvis_branch_nudge_alignment.py
      - scripts/diagnose_flyvis_temporal_ce_credit_alignment.py
      - scripts/run_flyvis_retinotopic_temporal_adam.py
      - scripts/run_flyvis_credit_residual_scaling.py
      - src/predcircuit/**
  workflow_dispatch:

jobs:
  trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nudge_steps: [8, 16, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Track training geometry at nudge ${{ matrix.nudge_steps }}
        run: >-
          uv run python scripts/diagnose_flyvis_branched_training_trajectory.py
          --seeds 5
          --epochs 100
          --checkpoint-every 10
          --frames 7
          --frame-steps 2
          --nudge-steps ${{ matrix.nudge_steps }}
          --step-size 0.015
          --beta 0.03
          --learning-rate 0.01
          --adam-epsilon 1e-8
          --test-repeats 4
          --out results/generated/flyvis_branched_training_trajectory_${{ matrix.nudge_steps }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: flyvis-branched-training-trajectory-${{ matrix.nudge_steps }}
          path: results/generated/flyvis_branched_training_trajectory_${{ matrix.nudge_steps }}.csv
