name: PC-ALM propagation front

on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_pcalm_propagation_front.py
      - .github/workflows/pcalm-propagation-front.yml
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [970, 971, 972]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Trace propagation front
        run: python scripts/diagnose_pcalm_propagation_front.py --seed ${{ matrix.seed }} --out results/propagation-front-${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-propagation-front-${{ matrix.seed }}
          path: results/propagation-front-${{ matrix.seed }}.csv
