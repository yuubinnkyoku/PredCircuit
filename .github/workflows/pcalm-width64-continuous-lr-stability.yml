name: PC-ALM width-64 continuous LR stability

on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_pcalm_width64_continuous_lr_stability.py
      - .github/workflows/pcalm-width64-continuous-lr-stability.yml
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: >-
          uv run python scripts/diagnose_pcalm_width64_continuous_lr_stability.py
          --seed ${{ matrix.seed }}
          --out results/generated/pcalm_width64_continuous_lr_stability_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-width64-continuous-lr-stability-seed-${{ matrix.seed }}
          path: results/generated/pcalm_width64_continuous_lr_stability_seed${{ matrix.seed }}.csv
