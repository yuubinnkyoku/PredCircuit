name: PC-ALM multiplier-free state-step budget sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcalm-width64-dyadic-state-step-budget.yml
      - scripts/diagnose_pcalm_width64_dyadic_state_step_budget.py

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859]
        budget: [64, 96, 128]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Run dyadic state-step budget point
        run: |
          uv run python scripts/diagnose_pcalm_width64_dyadic_state_step_budget.py \
            --seed ${{ matrix.seed }} \
            --budget ${{ matrix.budget }} \
            --out results/generated/pcalm_width64_dyadic_step_T${{ matrix.budget }}_seed${{ matrix.seed }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pcalm-dyadic-step-T${{ matrix.budget }}-seed-${{ matrix.seed }}
          path: results/generated/pcalm_width64_dyadic_step_T${{ matrix.budget }}_seed${{ matrix.seed }}.csv
          if-no-files-found: error
