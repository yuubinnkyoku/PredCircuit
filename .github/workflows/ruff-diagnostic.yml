name: Ruff diagnostic

on:
  push:
    paths:
      - ".github/workflows/ruff-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv sync --extra malecns
      - name: Capture Ruff output
        run: |
          set +e
          uv run ruff check src tests scripts > ruff.txt 2>&1
          cat ruff.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostic
          path: ruff.txt
          if-no-files-found: error
